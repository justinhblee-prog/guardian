name: Guardian Git CLI Automation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/guardian-git-agent.ps1'
      - 'scripts/guardian-git-agent-bootstrap.ps1'
      - 'scripts/guardian-multiflow.ps1'
      - 'scripts/guardian-copilot-worker.ps1'
      - 'scripts/guardian_multiflow.py'
      - 'scripts/test_guardian_multiflow.py'
      - '.guardian/automation/tasks.json'
      - '.github/workflows/guardian-windows-multiflow.yml'
      - '.github/workflows/aider-qwen-local.yml'
      - '.github/workflows/guardian-git-automation.yml'
  pull_request:
    paths:
      - 'scripts/guardian-git-agent.ps1'
      - 'scripts/guardian-git-agent-bootstrap.ps1'
      - 'scripts/guardian-multiflow.ps1'
      - 'scripts/guardian-copilot-worker.ps1'
      - 'scripts/guardian_multiflow.py'
      - 'scripts/test_guardian_multiflow.py'
      - '.guardian/automation/tasks.json'
      - '.github/workflows/guardian-windows-multiflow.yml'
      - '.github/workflows/aider-qwen-local.yml'
      - '.github/workflows/guardian-git-automation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guardian-git-cli-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-agent:
    name: Validate Windows Git CLI automation scripts
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse PowerShell and verify safety guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('scripts/guardian-git-agent.ps1', 'scripts/guardian-git-agent-bootstrap.ps1', 'scripts/guardian-multiflow.ps1', 'scripts/guardian-copilot-worker.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ('{0}: {1}' -f $path, $_.Message) }
              throw "PowerShell syntax validation failed: $path"
            }
          }
          $source = Get-Content -Raw -LiteralPath 'scripts/guardian-git-agent.ps1'
          $bootstrap = Get-Content -Raw -LiteralPath 'scripts/guardian-git-agent-bootstrap.ps1'
          $required = @(
            'gh auth status',
            'gh pr list',
            '--rebase-merges',
            '--force-with-lease',
            'merge-base',
            'Register-ScheduledTask',
            'Unregister-ScheduledTask',
            'Invoke-AgentWithLock',
            'guardian-git-agent-bootstrap.ps1'
          )
          foreach ($token in $required) {
            if (-not $source.Contains($token)) { throw "Required agent operation or safety guard missing: $token" }
          }
          foreach ($token in @('fetch origin main --prune', 'merge --ff-only origin/main', 'FileShare]::None', 'Stop-Process', 'guardian-git-agent.ps1')) {
            if (-not $bootstrap.Contains($token)) { throw "Bootstrap safety operation missing: $token" }
          }
          if ($source -match 'push\s+--force(?!-with-lease)' -or $bootstrap -match 'reset\s+--hard') {
            throw 'Unsafe force push or destructive hard reset detected.'
          }
          if (-not $source.Contains('guardian-multiflow.ps1')) { throw 'Scheduled Git agent is not wired to the local Ollama multi-flow worker.' }
          $legacyWorker = Get-Content -Raw -LiteralPath 'scripts/guardian-copilot-worker.ps1'
          if ($legacyWorker -match 'copilot\.Source|winget install --id GitHub\.Copilot|--autopilot') {
            throw 'Legacy worker must not invoke Copilot or a remote AI fallback.'
          }
          if (-not (Test-Path 'docs/GIT_CLI_AUTOMATION_KO.md')) {
            throw 'Git CLI automation operating guide is missing.'
          }
          Write-Host 'PASS: agent/bootstrap PowerShell syntax, local-only wiring and Git safety guards.'

      - name: Set up Python for local multi-flow validator tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Guardian local Ollama multi-flow safety boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/guardian_multiflow.py scripts/test_guardian_multiflow.py
          $compileExit = $LASTEXITCODE
          Write-Host "Python compile exit code: $compileExit"
          if ($compileExit -ne 0) { throw 'Python compile validation failed.' }
          python scripts/test_guardian_multiflow.py
          $testExit = $LASTEXITCODE
          Write-Host "Guardian multi-flow test process exit code: $testExit"
          if ($testExit -ne 0) { throw 'Guardian multi-flow safety tests failed.' }
          exit 0
