name: Guardian Engineering Orchestrator

on:
  workflow_dispatch:
  schedule:
    # Re-check the latest integrated Android state every six hours (UTC).
    - cron: '17 */6 * * *'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'server/**'
      - 'shared/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: guardian-orchestrator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android build, unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Avoid the action's deprecated default "tools" package; this workflow
          # installs the exact platform/build-tools versions in the next step.
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Resolve monotonic development APK version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/guardian-releases.json
          # Keep the orchestrator build aligned with android-apk.yml. The installed
          # predecessor is 0.7.52-dev (versionCode 65); never let CI artifacts
          # be generated from the older historical 0.7.42-dev baseline.
          python3 scripts/resolve_guardian_dev_version.py \
            --releases-json /tmp/guardian-releases.json \
            --commit "$GITHUB_SHA" \
            --baseline-version "0.7.52-dev" \
            --baseline-code 65 \
            --github-env "$GITHUB_ENV" \
            --github-output "$GITHUB_OUTPUT"
      - name: Validate development version resolver contract
        run: python3 -m unittest scripts/test_resolve_guardian_dev_version.py
      - name: Unit tests
        run: gradle -p android --no-daemon clean testDebugUnitTest
      - name: Lint
        run: gradle -p android --no-daemon lintDebug
      - name: Assemble APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Record APK evidence
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          sha256sum "$apk" | tee android-apk.sha256
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          package_line="$("$aapt" dump badging "$apk" | grep "^package:")"
          echo "$package_line" | tee guardian-build-info.txt
          echo "$package_line" | grep -F "versionName='$GUARDIAN_VERSION_NAME'"
          echo "$package_line" | grep -F "versionCode='$GUARDIAN_VERSION_CODE'"
          echo "source_commit=$GITHUB_SHA" >> guardian-build-info.txt
          echo "version_name=$GUARDIAN_VERSION_NAME" >> guardian-build-info.txt
          echo "version_code=$GUARDIAN_VERSION_CODE" >> guardian-build-info.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orchestrator-android-evidence
          path: |
            android-apk.sha256
            guardian-build-info.txt
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

  backend:
    name: Backend, API and deployment configuration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover and run package test suites
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find server -type f -name package.json -not -path '*/node_modules/*' -print 2>/dev/null | sort)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No server package.json files found."
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            dir="$(dirname "$manifest")"
            echo "::group::Test $dir"
            node -e "const p=require('./$manifest'); if (!p.scripts || !p.scripts.test) process.exit(2)"
            if [ -f "$dir/package-lock.json" ]; then
              (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund && npm test)
            else
              (cd "$dir" && npm install --ignore-scripts --no-audit --no-fund && npm test)
            fi
            echo "::endgroup::"
          done
      - name: Validate each discovered Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t compose_files < <(find . -maxdepth 5 -type f \( -iname 'compose.yml' -o -iname 'compose.yaml' -o -iname 'docker-compose.yml' -o -iname 'docker-compose.yaml' \) -not -path '*/node_modules/*' | sort)
          if [ "${#compose_files[@]}" -eq 0 ]; then
            echo "No Compose manifest discovered; not applicable."
            exit 0
          fi

          # Compose files intentionally require external paths and production secrets.
          # Supply disposable CI-only placeholders so syntax/interpolation is checked
          # without provisioning a server or using any real credential.
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root/filter-dist"
          : > "$test_root/filter.env"
          export GUARDIAN_FILTER_ENV_FILE="$test_root/filter.env"
          export GUARDIAN_FILTER_DIST_DIR="$test_root/filter-dist"
          export POSTGRES_PASSWORD='ci-placeholder-not-a-secret'
          export GUARDIAN_ADMIN_TOKEN='ci-placeholder-not-a-secret'
          export GUARDIAN_LICENSE_LOOKUP_SECRET='ci-placeholder-not-a-secret'
          export GUARDIAN_LICENSE_PRIVATE_KEY='ci-placeholder-not-a-secret'

          for compose_file in "${compose_files[@]}"; do
            echo "Validating $compose_file with disposable CI placeholders"
            docker compose -f "$compose_file" config -q
          done

  repository-integrity:
    name: Repository integrity and automation safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check whitespace and conflict markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- ':!*.lock'; then
            echo "Merge-conflict markers found."
            exit 1
          fi
      - name: Validate automation scripts
        shell: bash
        run: |
          set -euo pipefail
          if [ -d scripts ]; then
            while IFS= read -r file; do bash -n "$file"; done < <(find scripts -type f -name '*.sh' -print)
            python3 -m compileall -q scripts
          fi
      - name: Capture immutable run identity
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } | tee orchestrator-run-identity.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orchestrator-integrity-evidence
          path: orchestrator-run-identity.txt
          if-no-files-found: warn
          retention-days: 14

  mobile-contracts:
    name: Mobile feature and regression contract audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Android core and regression test coverage files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            android/app/src/test/java/com/guardian/adblock/DnsProbeTest.kt
            android/app/src/test/java/com/guardian/adblock/FilterManifestVerifierTest.kt
            android/app/src/test/java/com/guardian/adblock/FilterCacheStoreTest.kt
            android/app/src/test/java/com/guardian/adblock/ProtectionRestorePolicyTest.kt
            android/app/src/test/java/com/guardian/adblock/ResponsiveLayoutPolicyTest.kt
            android/app/src/test/java/com/guardian/adblock/LicenseEntitlementVerifierTest.kt
            android/app/src/test/java/com/guardian/adblock/GuardianStableUpdatePolicyTest.kt
            scripts/verify_android_vpn_emulator.sh
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Required mobile regression asset missing: $file"; exit 1; }
          done
          bash -n scripts/verify_android_vpn_emulator.sh
          bash -n scripts/verify_android_emulator.sh
      - name: Run standalone automation regression tests
        run: |
          python3 -m unittest \
            scripts/test_resolve_guardian_dev_version.py \
            scripts/test_verify_guardian_crash_log.py \
            scripts/test_resolve_android_dialog_row.py
      - name: Record mobile contract evidence
        if: always()
        run: |
          {
            echo "## Mobile contract audit"
            echo "- Commit: $GITHUB_SHA"
            echo "- Trigger: $GITHUB_EVENT_NAME"
            echo "- Required DNS/filter/restore/responsive/license/update/E2E assets checked."
            echo "- This static contract audit does not replace Android emulator or physical-device tests."
          } >> "$GITHUB_STEP_SUMMARY"

  decision:
    name: Engineering verification decision
    if: always()
    needs: [android, backend, mobile-contracts, repository-integrity]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed unless every required track passed
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          INTEGRITY_RESULT: ${{ needs.repository-integrity.result }}
          MOBILE_RESULT: ${{ needs.mobile-contracts.result }}
        run: |
          printf 'Android=%s Backend=%s MobileContracts=%s Integrity=%s\n' "$ANDROID_RESULT" "$BACKEND_RESULT" "$MOBILE_RESULT" "$INTEGRITY_RESULT"
          {
            echo "## Guardian engineering decision"
            echo "- Android build/tests/lint: $ANDROID_RESULT"
            echo "- Backend/API/subscription tests: $BACKEND_RESULT"
            echo "- Mobile regression contracts: $MOBILE_RESULT"
            echo "- Repository integrity: $INTEGRITY_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$ANDROID_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$MOBILE_RESULT" = success
          test "$INTEGRITY_RESULT" = success
