name: Guardian Hosted Runner Dispatch Diagnostic
on:
  push:
    paths:
      - '.github/workflows/hosted-runner-diagnostic.yml'
  pull_request:
    paths:
      - '.github/workflows/hosted-runner-diagnostic.yml'
permissions:
  contents: read
jobs:
  hosted-runner-smoke:
    name: Confirm GitHub-hosted runner assignment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm runner was actually assigned
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "github_ref=${GITHUB_REF}"
          test -n "${RUNNER_NAME}"
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"
          echo "HOSTED_RUNNER_DISPATCH_OK"
