name: Guardian Local Ollama Runner Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aider-qwen-local.yml"
      - ".github/workflows/guardian-windows-multiflow.yml"
      - ".github/workflows/guardian-git-automation.yml"
      - ".guardian/automation/tasks.json"
      - "scripts/guardian_multiflow.py"
      - "scripts/guardian-multiflow.ps1"
      - "scripts/guardian-copilot-worker.ps1"
      - ".guardian/automation/tasks.json"
      - "scripts/guardian_multiflow.py"
      - "scripts/guardian-multiflow.ps1"
      - "scripts/test_guardian_multiflow.py"
      - ".github/workflows/guardian-windows-multiflow.yml"
      # Exercise the local Ollama runner whenever the independent multi-flow automation changes.
      - ".guardian/automation/tasks.json"
      - "scripts/guardian_multiflow.py"
      - "scripts/guardian-multiflow.ps1"
      - ".github/workflows/guardian-windows-multiflow.yml"
      - "scripts/guardian-git-agent.ps1"
      - "scripts/guardian-git-agent-bootstrap.ps1"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/aider-qwen-local.yml"
      - ".github/workflows/guardian-windows-multiflow.yml"
      - ".guardian/automation/tasks.json"
      - "scripts/guardian_multiflow.py"
      - "scripts/guardian-multiflow.ps1"
      - "scripts/guardian-copilot-worker.ps1"
      # Exercise the local Ollama runner whenever the independent multi-flow automation changes.
      - ".guardian/automation/tasks.json"
      - "scripts/guardian_multiflow.py"
      - "scripts/guardian-multiflow.ps1"
      - ".github/workflows/guardian-windows-multiflow.yml"
      - "scripts/guardian-git-agent.ps1"
      - "scripts/guardian-git-agent-bootstrap.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardian-local-ollama-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-local-ollama:
    name: Verify real local Ollama inference on the Windows runner
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows]
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify loopback Ollama and real Qwen inference
        shell: pwsh
        env:
          GUARDIAN_OLLAMA_MODEL: qwen2.5-coder:7b
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OS -ne 'Windows_NT') { throw 'This verification requires the Windows self-hosted Runner.' }
          $api = 'http://127.0.0.1:11434'
          $modelName = $env:GUARDIAN_OLLAMA_MODEL
          $log = Join-Path $env:RUNNER_TEMP 'guardian-local-ollama-smoke.log'
          "Endpoint=$api Model=$modelName" | Set-Content -LiteralPath $log -Encoding UTF8

          $tags = Invoke-RestMethod -Uri "$api/api/tags" -TimeoutSec 20
          $installed = @($tags.models | Where-Object { $_.name -eq $modelName -or $_.model -eq $modelName })
          if ($installed.Count -eq 0) { throw "Required local Ollama model is not installed: $modelName" }

          $body = @{
            model = $modelName
            stream = $false
            format = 'json'
            options = @{ temperature = 0; num_predict = 64 }
            messages = @(@{
              role = 'user'
              content = 'Return JSON only: {"token":"GUARDIAN_LOCAL_OLLAMA_OK"}'
            })
          } | ConvertTo-Json -Depth 8 -Compress
          $reply = Invoke-RestMethod -Uri "$api/api/chat" -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 180
          $response = [string]$reply.message.content
          $response | Add-Content -LiteralPath $log -Encoding UTF8
          try { $result = $response | ConvertFrom-Json -ErrorAction Stop }
          catch { throw 'Ollama returned malformed JSON in the real model inference response.' }
          if ($result.token -ne 'GUARDIAN_LOCAL_OLLAMA_OK') {
            throw 'Ollama returned an unexpected token; local inference is not verified.'
          }
          Write-Host "PASS: local Ollama model $modelName completed a real /api/chat inference."
          'PASS: real loopback inference' | Add-Content -LiteralPath $log -Encoding UTF8

      - name: Upload local inference verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-local-ollama-verification
          path: ${{ runner.temp }}/guardian-local-ollama-smoke.log
          if-no-files-found: ignore
          retention-days: 7
