name: Guardian Neon Production License API Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardian-neon-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, package and deploy Neon Function
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: guardian_test_password
          POSTGRES_DB: guardian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://guardian:guardian_test_password@localhost:5432/guardian_test
    defaults:
      run:
        working-directory: server/license-api
    steps:
      - name: Require the protected main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deployment is allowed only from main."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build and verify admin assets
        run: |
          npm run build:admin-assets
          git diff --exit-code -- src/admin-assets.mjs

      - name: Initialize isolated test database
        run: |
          for attempt in $(seq 1 20); do
            if pg_isready -h localhost -p 5432 -U guardian -d guardian_test; then break; fi
            sleep 2
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema.sql
          for migration in migrations/002_shared_rate_limit_buckets.sql migrations/003_support_tickets.sql migrations/004_customers.sql migrations/005_shared_guardian_product.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Run API, cryptographic and Neon adapter tests
        run: npm test

      - name: Package Neon Function with root entrypoint
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/guardianapi-bundle"
          mkdir -p "$bundle/src"
          cp src/license-api-runtime.mjs src/fetch-adapter.mjs src/admin-assets.mjs src/license-core.mjs src/rate-limit.mjs "$bundle/src/"
          cp package.json "$bundle/package.json"
          cat > "$bundle/index.mjs" <<'EOF'
          import { attachDatabasePool } from '@neon/functions';
          import { createLicenseApiRuntime } from './src/license-api-runtime.mjs';
          import { handleFetchRequest } from './src/fetch-adapter.mjs';
          import { adminAssets } from './src/admin-assets.mjs';
          const env = process.env;
          const runtime = createLicenseApiRuntime(env, { adminAssets });
          if (runtime.pool && env.NEON_BRANCH) attachDatabasePool(runtime.pool);
          export default {
            async fetch(request) {
              const forwarded = request.headers.get('x-forwarded-for') || '';
              const addresses = forwarded.split(',').map(value => value.trim()).filter(Boolean);
              return handleFetchRequest(request, runtime, addresses.at(-1) || 'unknown');
            }
          };
          EOF
          (cd "$bundle" && zip -q -r "$RUNNER_TEMP/guardianapi.zip" index.mjs package.json src)
          unzip -t "$RUNNER_TEMP/guardianapi.zip"
          unzip -Z1 "$RUNNER_TEMP/guardianapi.zip" | grep -Fx 'index.mjs'
          unzip -Z1 "$RUNNER_TEMP/guardianapi.zip" | grep -Fx 'package.json'
          unzip -Z1 "$RUNNER_TEMP/guardianapi.zip" | grep -Fx 'src/license-api-runtime.mjs'

      - name: Deploy to Neon and verify live readiness
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_BRANCH_ID }}
          GUARDIAN_ADMIN_TOKEN: ${{ secrets.GUARDIAN_ADMIN_TOKEN }}
          GUARDIAN_LICENSE_LOOKUP_SECRET: ${{ secrets.GUARDIAN_LICENSE_LOOKUP_SECRET }}
          GUARDIAN_LICENSE_PRIVATE_KEY: ${{ secrets.GUARDIAN_LICENSE_PRIVATE_KEY }}
        run: node scripts/deploy-neon-function.mjs "$RUNNER_TEMP/guardianapi.zip"
