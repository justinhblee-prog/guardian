name: Guardian Windows build

on:
  push:
    branches: [main]
    paths:
      - "dns_engine/**"
      - "windows_engine/**"
      - "installer/**"
      - "requirements-dev.txt"
      - "requirements-windows-build.txt"
      - "scripts/build_windows.ps1"
      - "scripts/windows_dns_task_smoke.py"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "dns_engine/**"
      - "windows_engine/**"
      - "installer/**"
      - "requirements-dev.txt"
      - "requirements-windows-build.txt"
      - "scripts/build_windows.ps1"
      - "scripts/windows_dns_task_smoke.py"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build EXE and installer
        shell: pwsh
        env:
          GUARDIAN_SIGNING_CERT_BASE64: ${{ secrets.GUARDIAN_SIGNING_CERT_BASE64 }}
          GUARDIAN_SIGNING_CERT_PASSWORD: ${{ secrets.GUARDIAN_SIGNING_CERT_PASSWORD }}
        run: ./scripts/build_windows.ps1
      - name: Verify Authenticode signatures or report unsigned development build
        shell: pwsh
        env:
          GUARDIAN_SIGNING_CERT_BASE64: ${{ secrets.GUARDIAN_SIGNING_CERT_BASE64 }}
        run: |
          $files = @(
            'dist/GuardianAdBlock/GuardianAdBlock.exe',
            'dist/GuardianDnsProxy/GuardianDnsProxy.exe',
            (Get-ChildItem 'dist/installer/Guardian-AdBlock-Windows-Setup-*.exe' | Select-Object -First 1).FullName
          )
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            Write-Host "$file => $($signature.Status)"
            if (-not [string]::IsNullOrWhiteSpace($env:GUARDIAN_SIGNING_CERT_BASE64) -and $signature.Status -ne 'Valid') {
              throw "Expected a valid trusted Authenticode signature: $file"
            }
          }
          if ([string]::IsNullOrWhiteSpace($env:GUARDIAN_SIGNING_CERT_BASE64)) {
            Write-Warning 'Unsigned development package: Windows SmartScreen may block or warn. CI installation success does not establish publisher reputation.'
          }
      - name: Install and smoke-test packaged Windows app
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/installer/Guardian-AdBlock-Windows-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer not found" }
          $installDir = Join-Path $env:RUNNER_TEMP "GuardianInstall"
          $installLog = Join-Path $env:RUNNER_TEMP "guardian-install.log"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir", "/LOG=$installLog") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $installLog) { Get-Content $installLog -Tail 80 }
            throw "Silent installation failed with exit code $($process.ExitCode)"
          }
          $desktopTest = Start-Process -FilePath "$installDir\GuardianAdBlock.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($desktopTest.ExitCode -ne 0) {
            $selfTestLog = Join-Path $env:TEMP "GuardianDesktopSelfTest.log"
            if (Test-Path $selfTestLog) { Get-Content $selfTestLog }
            throw "Installed desktop executable self-test failed with exit code $($desktopTest.ExitCode)"
          }
          $daemonTest = Start-Process -FilePath "$installDir\GuardianDnsProxy\GuardianDnsProxy.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($daemonTest.ExitCode -ne 0) { throw "Installed background DNS daemon self-test failed with exit code $($daemonTest.ExitCode)" }
          if (-not (Test-Path "$installDir\GuardianDnsProxy\_internal")) { throw "Installed DNS daemon runtime dependencies are missing" }
          $task = Get-ScheduledTask -TaskName GuardianDnsProxy -ErrorAction SilentlyContinue
          if (-not $task) { throw "Boot-start DNS task was not registered" }
          $daemonExe = Join-Path $installDir "GuardianDnsProxy\GuardianDnsProxy.exe"
          if (-not (Test-Path -LiteralPath $daemonExe -PathType Leaf)) { throw "Installed DNS daemon executable is missing: $daemonExe" }
          $taskXml = [xml](Export-ScheduledTask -TaskName GuardianDnsProxy)
          $taskCommand = [Environment]::ExpandEnvironmentVariables([string]$taskXml.Task.Actions.Exec.Command)
          if ([IO.Path]::GetFullPath($taskCommand) -ne [IO.Path]::GetFullPath($daemonExe)) {
            throw "Scheduled DNS task points to '$taskCommand' instead of installed executable '$daemonExe'"
          }
          python scripts/windows_dns_task_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "Installed SYSTEM DNS task failed its IPv4 UDP/TCP loopback smoke test" }
          $restoreTest = Start-Process -FilePath "$installDir\GuardianAdBlock.exe" -ArgumentList "--restore-dns" -Wait -PassThru
          if ($restoreTest.ExitCode -ne 0) { throw "DNS restore and task cleanup command failed with exit code $($restoreTest.ExitCode)" }
          $task = Get-ScheduledTask -TaskName GuardianDnsProxy -ErrorAction SilentlyContinue
          if ($task) { throw "Guardian restore command left the boot task registered" }
          $uninstallLog = Join-Path $env:RUNNER_TEMP "guardian-uninstall.log"
          $uninstall = Start-Process -FilePath "$installDir\unins000.exe" -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$uninstallLog") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            if (Test-Path $uninstallLog) { Get-Content $uninstallLog -Tail 100 }
            throw "Silent uninstall failed with exit code $($uninstall.ExitCode)"
          }
          $task = Get-ScheduledTask -TaskName GuardianDnsProxy -ErrorAction SilentlyContinue
          if ($task) { throw "Uninstall left the boot-start DNS task registered" }

          # Exercise the real uninstall cleanup path with the boot task still registered.
          # This second installation deliberately skips --restore-dns before uninstall.
          $installDir2 = Join-Path $env:RUNNER_TEMP "GuardianDirectUninstall"
          $installLog2 = Join-Path $env:RUNNER_TEMP "guardian-direct-install.log"
          $process2 = Start-Process -FilePath $installer.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir2", "/LOG=$installLog2") -Wait -PassThru
          if ($process2.ExitCode -ne 0) {
            if (Test-Path $installLog2) { Get-Content $installLog2 -Tail 80 }
            throw "Second silent installation failed with exit code $($process2.ExitCode)"
          }
          $task = Get-ScheduledTask -TaskName GuardianDnsProxy -ErrorAction SilentlyContinue
          if (-not $task) { throw "Second installation did not register the boot-start DNS task" }
          $uninstallLog2 = Join-Path $env:RUNNER_TEMP "guardian-direct-uninstall.log"
          $uninstall2 = Start-Process -FilePath "$installDir2\\unins000.exe" -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$uninstallLog2") -Wait -PassThru
          if ($uninstall2.ExitCode -ne 0) {
            if (Test-Path $uninstallLog2) { Get-Content $uninstallLog2 -Tail 100 }
            throw "Direct uninstall failed with exit code $($uninstall2.ExitCode)"
          }
          $task = Get-ScheduledTask -TaskName GuardianDnsProxy -ErrorAction SilentlyContinue
          if ($task) { throw "Direct uninstall left the boot-start DNS task registered" }
      - name: Verify generated package
        shell: pwsh
        run: |
          $exe = Get-Item dist/GuardianAdBlock/GuardianAdBlock.exe
          $installer = Get-ChildItem dist/installer/Guardian-AdBlock-Windows-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer not found" }
          Get-FileHash $exe.FullName -Algorithm SHA256
          Get-FileHash $installer.FullName -Algorithm SHA256
          Get-Item $exe.FullName, $installer.FullName | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Guardian-AdBlock-Windows-Dev-Package
          path: |
            dist/GuardianAdBlock/
            dist/GuardianDnsProxy/
            dist/installer/Guardian-AdBlock-Windows-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
