name: Guardian Windows build

on:
  push:
    branches: [main]
    paths:
      - "dns_engine/**"
      - "windows_engine/**"
      - "VERSION"
      - "installer/**"
      - "requirements-dev.txt"
      - "requirements-windows-build.txt"
      - "scripts/build_windows.ps1"
      - "VERSION"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "dns_engine/**"
      - "windows_engine/**"
      - "installer/**"
      - "requirements-dev.txt"
      - "requirements-windows-build.txt"
      - "scripts/build_windows.ps1"
      - "VERSION"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build EXE and installer
        shell: pwsh
        env:
          GUARDIAN_SIGNING_CERT_BASE64: ${{ secrets.GUARDIAN_SIGNING_CERT_BASE64 }}
          GUARDIAN_SIGNING_CERT_PASSWORD: ${{ secrets.GUARDIAN_SIGNING_CERT_PASSWORD }}
        run: ./scripts/build_windows.ps1
      - name: Verify Authenticode signatures or report unsigned development build
        shell: pwsh
        env:
          GUARDIAN_SIGNING_CERT_BASE64: ${{ secrets.GUARDIAN_SIGNING_CERT_BASE64 }}
        run: |
          $files = @(
            'dist/GuardianAdBlock/GuardianAdBlock.exe',
            'dist/GuardianDnsProxy/GuardianDnsProxy.exe',
            'dist/GuardianSelfTest/GuardianSelfTest.exe',
            'dist/GuardianMaintenance/GuardianMaintenance.exe',
            (Get-ChildItem 'dist/installer/Guardian-AdBlock-Windows-Setup-*.exe' | Select-Object -First 1).FullName
          )
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            Write-Host "$file => $($signature.Status)"
            if (-not [string]::IsNullOrWhiteSpace($env:GUARDIAN_SIGNING_CERT_BASE64) -and $signature.Status -ne 'Valid') {
              throw "Expected a valid trusted Authenticode signature: $file"
            }
          }
          if ([string]::IsNullOrWhiteSpace($env:GUARDIAN_SIGNING_CERT_BASE64)) {
            Write-Warning 'Unsigned development package: Windows SmartScreen may block or warn. CI installation success does not establish publisher reputation.'
          }
      - name: Install and smoke-test packaged Windows app
        timeout-minutes: 15
        shell: pwsh
        run: |
          function Invoke-GuardianProcess {
            param(
              [Parameter(Mandatory=$true)][string]$FilePath,
              [AllowEmptyCollection()][string[]]$ArgumentList = @(),
              [int]$TimeoutSeconds = 120,
              [string]$Label = "Guardian process"
            )
            $runId = [guid]::NewGuid().ToString("N")
            $stdoutPath = Join-Path $env:RUNNER_TEMP "guardian-$runId.stdout.log"
            $stderrPath = Join-Path $env:RUNNER_TEMP "guardian-$runId.stderr.log"
            Write-Host "Starting $Label (timeout: $TimeoutSeconds seconds): $FilePath"
            $process = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
            if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
              Write-Error "$Label exceeded its $TimeoutSeconds-second timeout; terminating process tree."
              & taskkill.exe /PID $process.Id /T /F | Out-Host
              if ($Label -eq "Packaged DNS self-test") {
                $selfTestLog = Join-Path $env:TEMP "GuardianDnsSelfTest.log"
                if (Test-Path $selfTestLog) { Write-Host "=== Guardian DNS package self-test stage log ==="; Get-Content $selfTestLog -Tail 100 | Out-Host }
              }
              if (Test-Path $stdoutPath) { Get-Content $stdoutPath -Tail 100 | Out-Host }
              if (Test-Path $stderrPath) { Get-Content $stderrPath -Tail 100 | Out-Host }
              throw "$Label timed out"
            }
            $process.Refresh()
            Write-Host "$Label exited with code $($process.ExitCode)"
            if (Test-Path $stdoutPath) { Get-Content $stdoutPath -Tail 100 | Out-Host }
            if (Test-Path $stderrPath) { Get-Content $stderrPath -Tail 100 | Out-Host }
            return $process
          }
          $installer = Get-ChildItem dist/installer/Guardian-AdBlock-Windows-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer not found" }
          $installDir = Join-Path $env:RUNNER_TEMP "GuardianInstall"
          $installLog = Join-Path $env:RUNNER_TEMP "guardian-install.log"
          $process = Invoke-GuardianProcess -FilePath $installer.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir", "/LOG=$installLog") -TimeoutSeconds 180 -Label "First silent install"
          if ($process.ExitCode -ne 0) {
            if (Test-Path $installLog) { Get-Content $installLog -Tail 80 }
            throw "Silent installation failed with exit code $($process.ExitCode)"
          }
          # Launch the actual desktop GUI from the installed package. The runner starts
          # with no active Guardian protection state, so this smoke test does not
          # alter host DNS settings; it verifies the packaged Tkinter app stays alive.
          $desktopPath = Join-Path $installDir "GuardianAdBlock.exe"
          if (-not (Test-Path -LiteralPath $desktopPath)) { throw "Installed desktop executable is missing: $desktopPath" }
          $desktop = Start-Process -FilePath $desktopPath -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 6
          $desktop.Refresh()
          if ($desktop.HasExited) { throw "Installed Guardian desktop UI exited during startup (code $($desktop.ExitCode))." }
          Stop-Process -Id $desktop.Id -Force
          Write-Host "Installed Guardian desktop UI launch smoke test passed."
          $dnsPackageTest = Invoke-GuardianProcess -FilePath "$installDir\GuardianSelfTest\GuardianSelfTest.exe" -ArgumentList @() -TimeoutSeconds 30 -Label "Packaged DNS self-test"
          if ($dnsPackageTest.ExitCode -ne 0) {
            $selfTestLog = Join-Path $env:TEMP "GuardianDnsSelfTest.log"
            if (Test-Path $selfTestLog) { Get-Content $selfTestLog -Tail 100 }
            throw "Installed DNS package self-test failed with exit code $($dnsPackageTest.ExitCode)"
          }
          $daemonTest = Invoke-GuardianProcess -FilePath "$installDir\GuardianDnsProxy\GuardianDnsProxy.exe" -ArgumentList @("--self-test") -TimeoutSeconds 60 -Label "DNS daemon self-test"
          if ($daemonTest.ExitCode -ne 0) { throw "Installed background DNS daemon self-test failed with exit code $($daemonTest.ExitCode)" }
          if (-not (Test-Path "$installDir\GuardianDnsProxy\_internal")) { throw "Installed DNS daemon runtime dependencies are missing" }
          $task = Get-ScheduledTask -TaskName GuardianDnsProxy -ErrorAction SilentlyContinue
          if (-not $task) { throw "Boot-start DNS task was not registered" }
          $restoreTest = Invoke-GuardianProcess -FilePath "$installDir\GuardianMaintenance\GuardianMaintenance.exe" -ArgumentList @("--restore-dns") -TimeoutSeconds 90 -Label "DNS restore test"
          if ($restoreTest.ExitCode -ne 0) { throw "DNS restore and task cleanup command failed with exit code $($restoreTest.ExitCode)" }
          $task = Get-ScheduledTask -TaskName GuardianDnsProxy -ErrorAction SilentlyContinue
          if ($task) { throw "Guardian restore command left the boot task registered" }
          $uninstallLog = Join-Path $env:RUNNER_TEMP "guardian-uninstall.log"
          $uninstall = Invoke-GuardianProcess -FilePath "$installDir\unins000.exe" -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$uninstallLog") -TimeoutSeconds 180 -Label "First silent uninstall"
          if ($uninstall.ExitCode -ne 0) {
            if (Test-Path $uninstallLog) { Get-Content $uninstallLog -Tail 100 }
            throw "Silent uninstall failed with exit code $($uninstall.ExitCode)"
          }
          $task = Get-ScheduledTask -TaskName GuardianDnsProxy -ErrorAction SilentlyContinue
          if ($task) { throw "Uninstall left the boot-start DNS task registered" }

          # Exercise the real uninstall cleanup path with the boot task still registered.
          # This second installation deliberately skips --restore-dns before uninstall.
          $installDir2 = Join-Path $env:RUNNER_TEMP "GuardianDirectUninstall"
          $installLog2 = Join-Path $env:RUNNER_TEMP "guardian-direct-install.log"
          $process2 = Invoke-GuardianProcess -FilePath $installer.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir2", "/LOG=$installLog2") -TimeoutSeconds 180 -Label "Second silent install"
          if ($process2.ExitCode -ne 0) {
            if (Test-Path $installLog2) { Get-Content $installLog2 -Tail 80 }
            throw "Second silent installation failed with exit code $($process2.ExitCode)"
          }
          $task = Get-ScheduledTask -TaskName GuardianDnsProxy -ErrorAction SilentlyContinue
          if (-not $task) { throw "Second installation did not register the boot-start DNS task" }
          $uninstallLog2 = Join-Path $env:RUNNER_TEMP "guardian-direct-uninstall.log"
          $uninstall2 = Invoke-GuardianProcess -FilePath "$installDir2\unins000.exe" -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$uninstallLog2") -TimeoutSeconds 180 -Label "Direct silent uninstall"
          if ($uninstall2.ExitCode -ne 0) {
            if (Test-Path $uninstallLog2) { Get-Content $uninstallLog2 -Tail 100 }
            throw "Direct uninstall failed with exit code $($uninstall2.ExitCode)"
          }
          $task = Get-ScheduledTask -TaskName GuardianDnsProxy -ErrorAction SilentlyContinue
          if ($task) { throw "Direct uninstall left the boot-start DNS task registered" }
      - name: Verify generated package
        shell: pwsh
        run: |
          $exe = Get-Item dist/GuardianAdBlock/GuardianAdBlock.exe
          $dnsSelfTest = Get-Item dist/GuardianSelfTest/GuardianSelfTest.exe
          $maintenance = Get-Item dist/GuardianMaintenance/GuardianMaintenance.exe
          $installer = Get-ChildItem dist/installer/Guardian-AdBlock-Windows-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer not found" }
          Get-FileHash $exe.FullName -Algorithm SHA256
          Get-FileHash $dnsSelfTest.FullName -Algorithm SHA256
          Get-FileHash $maintenance.FullName -Algorithm SHA256
          Get-FileHash $installer.FullName -Algorithm SHA256
          Get-Item $exe.FullName, $dnsSelfTest.FullName, $maintenance.FullName, $installer.FullName | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Guardian-AdBlock-Windows-Dev-Package
          path: |
            dist/GuardianAdBlock/
            dist/GuardianDnsProxy/
            dist/GuardianSelfTest/
            dist/GuardianMaintenance/
            dist/installer/Guardian-AdBlock-Windows-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned Windows development update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $VersionLines = Get-Content VERSION
          $VersionName = $VersionLines[0].Trim()
          $BuildNumber = [int]$VersionLines[1].Trim()
          $Tag = "guardian-windows-dev-v$BuildNumber"
          $Installer = Get-ChildItem "dist/installer/Guardian-AdBlock-Windows-Setup-$VersionName-b$BuildNumber.exe" | Select-Object -First 1
          if (-not $Installer) { throw 'Versioned Windows installer was not produced.' }
          $Hash = (Get-FileHash $Installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $InstallerName = $Installer.Name
          $InstallerUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$Tag/$InstallerName"
          $Manifest = @{
            schemaVersion = 1
            product = 'Guardian AdBlock'
            platform = 'windows-x64'
            versionName = $VersionName
            buildNumber = $BuildNumber
            tagName = $Tag
            sourceCommit = $env:GITHUB_SHA
            installerName = $InstallerName
            installerUrl = $InstallerUrl
            sha256 = $Hash
          } | ConvertTo-Json -Depth 4
          $ManifestPath = 'dist/guardian-windows-update.json'
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $ManifestPath), $Manifest + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))
          gh release view $Tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Warning "Windows build $BuildNumber is already published. Bump VERSION before publishing changed code; existing release assets were not overwritten."
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { throw 'Could not determine whether the Windows update release already exists.' }
          gh release create $Tag $Installer.FullName $ManifestPath --repo $env:GITHUB_REPOSITORY --prerelease --title "Guardian AdBlock $VersionName (Windows)" --notes "Windows x64 development update. Build $BuildNumber. Source commit: $env:GITHUB_SHA. Installer SHA-256: $Hash. This development installer may be unsigned and may show a SmartScreen warning." --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the versioned Windows update release failed.' }
