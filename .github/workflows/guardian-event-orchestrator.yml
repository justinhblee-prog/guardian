name: Guardian Event-Driven Continuation

on:
  workflow_run:
    workflows: ["Guardian AdBlock Android APK"]
    types: [completed]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Android workflow run ID to audit"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: guardian-event-audit-${{ github.event.workflow_run.id || github.event.check_suite.head_sha || inputs.run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  publish-live-status:
    name: Refresh Guardian parallel-work status board
    if: github.event_name == 'check_suite'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update the single live status comment on issue 141
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- GUARDIAN_PARALLEL_STATUS -->';
            const activePullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const targets = activePullRequests
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))
              .slice(0, 12)
              .map(pr => pr.number);
            const sections = [];
            for (const number of targets) {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number
              });
              const pr = response.data;
              if (pr.state !== 'open') continue;
              const checksResponse = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
                per_page: 100
              });
              const checks = checksResponse.data.check_runs || [];
              const counts = { success: 0, failure: 0, in_progress: 0, queued: 0, skipped: 0, other: 0 };
              for (const check of checks) {
                if (check.status !== 'completed') counts[check.status === 'queued' ? 'queued' : 'in_progress']++;
                else if (check.conclusion === 'success') counts.success++;
                else if (['failure', 'timed_out', 'action_required'].includes(check.conclusion)) counts.failure++;
                else if (['skipped', 'neutral'].includes(check.conclusion)) counts.skipped++;
                else counts.other++;
              }
              const rows = checks.map(check => {
                const state = check.status === 'completed' ? (check.conclusion || 'completed') : check.status;
                return '| ' + check.name.replace(/\\|/g, '/') + ' | ' + state + ' |';
              });
              sections.push([
                '### PR #' + number + ' — ' + pr.title,
                '- Branch: `' + pr.head.ref + '`',
                '- Commit: `' + pr.head.sha.slice(0, 12) + '`',
                '- Checks: ' + checks.length + ' total · ' + counts.success + ' passed · ' + counts.in_progress + ' running · ' + counts.queued + ' queued · ' + counts.failure + ' failed · ' + counts.skipped + ' skipped',
                '',
                '| Track | Status |',
                '|---|---|',
                ...(rows.length ? rows : ['| Checks | No check runs reported |']),
                ''
              ].join('\\n'));
            }
            const body = [
              marker,
              '## Guardian 자동 병렬 작업 현황',
              '',
              '> GitHub Check Suite 완료 이벤트마다 자동 갱신됩니다. 실행 중이 아닌 작업을 실행 중이라고 표시하지 않습니다.',
              '',
              '- Updated: ' + new Date().toISOString(),
              '- Trigger: check suite completed',
              '',
              ...sections,
              '### 운영 원칙',
              '- 독립 검증 트랙은 GitHub Actions에서 병렬 실행합니다.',
              '- 완료 이벤트마다 상태판을 갱신합니다.',
              '- 실패는 실패로 표시하며, 러너 미배정과 코드 오류를 구분합니다.',
              '- 병합, 운영 릴리스, 유료 러너 설정은 자동 승인하지 않습니다.'
            ].join('\\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 141,
              per_page: 100
            });
            const existing = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 141,
                body
              });
            }

  audit-and-continue:
    name: Audit completed Android work and verify delivered artifacts
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve completed run and classify its result
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let run;
            if (context.eventName === 'workflow_run') {
              run = context.payload.workflow_run;
            } else {
              const runId = context.payload.inputs?.run_id;
              if (!runId || !/^\d+$/.test(runId)) {
                core.setFailed('Manual audit requires a numeric run_id.');
                return;
              }
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(runId)
              });
              run = response.data;
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100 }
            );
            const failedJobs = jobs.filter(job => job.conclusion === 'failure');
            const failedSteps = failedJobs.flatMap(job =>
              (job.steps || [])
                .filter(step => step.conclusion === 'failure')
                .map(step => ({ job: job.name, step: step.name, number: step.number }))
            );
            const noRunnerEvidence = failedJobs.length > 0 &&
              failedJobs.every(job => !(job.steps || []).some(step =>
                step.status === 'completed' || step.status === 'in_progress'
              ));

            let classification = 'success';
            if (run.conclusion === 'cancelled') {
              classification = 'superseded_or_cancelled_run';
            } else if (run.conclusion === 'skipped') {
              classification = 'skipped_run';
            } else if (run.conclusion !== 'success') {
              classification = noRunnerEvidence
                ? 'runner_or_job_start_failure'
                : failedSteps.length ? 'workflow_step_failure' : 'workflow_failure_unclassified';
            }

            fs.mkdirSync('audit', { recursive: true });
            const lines = [
              '# Guardian 자동 후속 검증 보고서',
              '',
              '- Workflow: ' + run.name,
              '- Run ID: ' + run.id,
              '- Result: ' + (run.conclusion || 'unknown'),
              '- Classification: ' + classification,
              '- Branch: ' + run.head_branch,
              '- Commit: ' + run.head_sha,
              '- Source run: ' + run.html_url,
              '- Jobs observed: ' + jobs.length,
              '',
              '## Failed steps',
              ...(failedSteps.length
                ? failedSteps.map(item => '- ' + item.job + ' / ' + item.step + ' (#' + item.number + ')')
                : ['- None recorded']),
              '',
              '## 자동 후속 처리',
              run.conclusion === 'success'
                ? '- APK와 전체 소스 ZIP을 다운로드하고 버전 메타데이터, SHA-256, ZIP 무결성을 검증합니다.'
                : noRunnerEvidence
                  ? '- 실행 단계가 시작되지 않은 실패로 분류했습니다. 앱 소스 오류로 단정하지 않습니다.'
                  : '- 실패 단계 정보를 수집했습니다. 이 워크플로는 자동으로 코드를 수정하거나 실패를 성공으로 바꾸지 않습니다.',
              '',
              '## 검증 한계',
              '- CI/에뮬레이터 검증은 Android 실기기 VPN 승인, 실제 DNS 경로, 광고 차단 효과를 증명하지 않습니다.',
              '- 이 이벤트 파이프라인은 추가 AI API 키나 유료 외부 에이전트를 호출하지 않습니다.'
            ];
            fs.writeFileSync('audit/GUARDIAN_EVENT_AUDIT.md', lines.join('\n') + '\n');
            core.setOutput('run_id', String(run.id));
            core.setOutput('conclusion', run.conclusion || 'unknown');
            core.setOutput('classification', classification);
            core.setOutput('run_url', run.html_url);
            core.setOutput('head_sha', run.head_sha);
            core.info('Classified source run ' + run.id + ' as ' + classification);

      - name: Download APK artifact from the completed run
        if: steps.source.outputs.conclusion == 'success'
        uses: actions/download-artifact@v4
        with:
          name: guardian-android-debug
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: audit/input

      - name: Verify APK and source artifact checksums
        if: steps.source.outputs.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find audit/input -type f -name app-debug.apk -print -quit)"
          apk_sums="$(find audit/input -path '*/android/app/build/outputs/apk/debug/SHA256SUMS.txt' -print -quit)"
          package_sums="$(find audit/input -path '*/release/SHA256SUMS.txt' -print -quit)"
          summary="$(find audit/input -type f -name VERIFICATION_SUMMARY_KO.md -print -quit)"
          test -n "$apk" && test -s "$apk"
          test -n "$apk_sums" && test -s "$apk_sums"
          test -n "$package_sums" && test -s "$package_sums"
          test -n "$summary" && test -s "$summary"

          version_name="$(sed -n 's/^- versionName: //p' "$summary" | head -n 1 | tr -d '\r')"
          version_code="$(sed -n 's/^- versionCode: //p' "$summary" | head -n 1 | tr -d '\r')"
          package_name="$(sed -n 's/^- 패키지: //p' "$summary" | head -n 1 | tr -d '\r')"
          [[ "$version_name" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$version_code" =~ ^[0-9]+$ ]]
          test "$package_name" = "com.guardian.adblock"

          source_name="Guardian-AdBlock-Source-${version_name}.zip"
          source_zip="$(find audit/input -type f -name "$source_name" -print -quit)"
          test -n "$source_zip" && test -s "$source_zip"

          expected_apk="$(awk '$2 == "android/app/build/outputs/apk/debug/app-debug.apk" {print $1; exit}' "$package_sums")"
          expected_source="$(awk -v name="release/$source_name" '$2 == name {print $1; exit}' "$package_sums")"
          apk_manifest="$(awk '$2 == "android/app/build/outputs/apk/debug/app-debug.apk" {print $1; exit}' "$apk_sums")"
          actual_apk="$(sha256sum "$apk" | awk '{print $1}')"
          actual_source="$(sha256sum "$source_zip" | awk '{print $1}')"
          [[ "$expected_apk" =~ ^[a-fA-F0-9]{64}$ ]]
          [[ "$expected_source" =~ ^[a-fA-F0-9]{64}$ ]]
          [[ "$apk_manifest" =~ ^[a-fA-F0-9]{64}$ ]]
          test "$expected_apk" = "$actual_apk"
          test "$apk_manifest" = "$actual_apk"
          test "$expected_source" = "$actual_source"
          unzip -t "$apk" >/dev/null
          unzip -t "$source_zip" >/dev/null
          source_bytes="$(wc -c < "$source_zip" | tr -d ' ')"
          apk_bytes="$(wc -c < "$apk" | tr -d ' ')"
          {
            echo
            echo "## APK and source artifact audit"
            echo "- Package: ${package_name}"
            echo "- Version: ${version_name} (${version_code})"
            echo "- APK: present and readable"
            echo "- APK size: ${apk_bytes} bytes"
            echo "- APK SHA-256: ${actual_apk}"
            echo "- Source ZIP: ${source_name}"
            echo "- Source ZIP size: ${source_bytes} bytes"
            echo "- Source ZIP SHA-256: ${actual_source}"
            echo "- APK/source ZIP integrity: passed"
            echo "- Source verification summary: present"
          } >> audit/GUARDIAN_EVENT_AUDIT.md
          echo "Verified Guardian ${version_name} APK and source ZIP: APK ${apk_bytes} bytes; source ${source_bytes} bytes."

      - name: Upload event audit report
        if: always() && steps.source.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: guardian-event-audit-${{ steps.source.outputs.run_id }}
          path: audit/GUARDIAN_EVENT_AUDIT.md
          if-no-files-found: warn
          retention-days: 30
