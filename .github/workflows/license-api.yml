name: Guardian License API
on:
  push:
    paths:
      - 'server/license-api/**'
      - '.github/workflows/license-api.yml'
  pull_request:
    paths:
      - 'server/license-api/**'
      - '.github/workflows/license-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-license-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: guardian_test_password
          POSTGRES_DB: guardian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://guardian:guardian_test_password@localhost:5432/guardian_test
    defaults:
      run:
        working-directory: server/license-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check server and admin JavaScript syntax
        run: |
          node --check src/server.mjs
          node --check src/license-core.mjs
          node --check src/rate-limit.mjs
          node --check admin/admin.js
          node --check test/postgres-integration.test.mjs
      - name: Validate Docker Compose deployment configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Initialize PostgreSQL integration schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema.sql
      - name: Run cryptographic, HTTP and PostgreSQL integration tests
        run: npm test
