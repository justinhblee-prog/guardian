name: Guardian Git Consistency Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - 'scripts/guardian-git-agent.ps1'
      - 'scripts/guardian-copilot-worker.ps1'
      - 'scripts/guardian-multiflow.ps1'
      - 'scripts/guardian_multiflow.py'
      - 'scripts/test_guardian_multiflow.py'
      - '.guardian/automation/tasks.json'
      - '.github/workflows/guardian-windows-multiflow.yml'
      - '.github/workflows/aider-qwen-local.yml'
      - 'docs/GIT_CLI_AUTOMATION_KO.md'
      - '.github/workflows/guardian.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardian-git-consistency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-compare:
    name: Validate Git CLI agent and PR baseline
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head or triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python for Guardian safety tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse PowerShell and verify safe Git operations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'scripts/guardian-git-agent.ps1',
            'scripts/guardian-git-agent-bootstrap.ps1',
            'scripts/guardian-copilot-worker.ps1',
            'scripts/guardian-multiflow.ps1'
          )
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Required PowerShell automation file is missing: $path" }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ('{0}: {1}' -f $path, $_.Message) }
              throw "PowerShell syntax validation failed: $path"
            }
          }
          $source = Get-Content -Raw -LiteralPath 'scripts/guardian-git-agent.ps1'
          $worker = Get-Content -Raw -LiteralPath 'scripts/guardian_multiflow.py'
          $legacy = Get-Content -Raw -LiteralPath 'scripts/guardian-copilot-worker.ps1'
          $required = @(
            'gh auth status',
            'gh pr list',
            "@('fetch', 'origin'",
            "@('worktree', 'add'",
            '--rebase-merges',
            '--force-with-lease',
            'merge-base',
            'Register-ScheduledTask',
            'Unregister-ScheduledTask',
            'Invoke-AgentWithLock',
            'guardian-multiflow.ps1'
          )
          foreach ($token in $required) {
            if (-not $source.Contains($token)) { throw "Required operation or safety guard missing: $token" }
          }
          if ($source -match 'push\s+--force(?!-with-lease)' -or $source -match 'git\s+reset\s+--hard') {
            throw 'Unsafe force push or destructive hard reset detected.'
          }
          $workerRequired = @(
            '127.0.0.1',
            '/api/tags',
            '/api/chat',
            'FileLease',
            'ollama_slot',
            'worktree',
            'validate_unified_patch',
            'TEST_PROFILES',
            'gh',
            '--draft'
          )
          foreach ($token in $workerRequired) {
            if (-not $worker.Contains($token)) { throw "Local Ollama worker is missing required operation or safety guard: $token" }
          }
          if ($legacy -match 'copilot\.Source|winget install --id GitHub\.Copilot|--autopilot') {
            throw 'Legacy entry point must not invoke Copilot or a remote AI fallback.'
          }
          if ($worker -match 'api\.openai\.com|api\.anthropic\.com|copilot\s+--autopilot') {
            throw 'Local Ollama worker contains an unexpected remote AI provider path.'
          }
          if (-not (Test-Path '.guardian/automation/tasks.json')) {
            throw 'Guardian task manifest is missing.'
          }
          if (-not (Test-Path 'docs/GIT_CLI_AUTOMATION_KO.md')) {
            throw 'Git CLI automation operating guide is missing.'
          }
          if (-not (Test-Path '.github/workflows/guardian-windows-multiflow.yml')) {
            throw 'Windows local Ollama multi-flow workflow is missing.'
          }
          Write-Host 'PASS: PowerShell automation syntax, local-only Ollama wiring and Git safety guards.'
      - name: Test Guardian local multi-flow manifest and safety
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/guardian_multiflow.py scripts/test_guardian_multiflow.py
          if ($LASTEXITCODE -ne 0) { throw 'Python compile failed.' }
          python -m unittest scripts.test_guardian_multiflow
          if ($LASTEXITCODE -ne 0) { throw 'Guardian multi-flow regression tests failed.' }


      - name: Compare exact PR head against current main with Git CLI
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch origin/main.' }
          $mergeBase = git merge-base origin/main HEAD
          if ($LASTEXITCODE -ne 0 -or -not $mergeBase) {
            throw 'PR head has no merge base with origin/main.'
          }
          $counts = (git rev-list --left-right --count origin/main...HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not calculate ahead/behind counts.' }
          $parts = $counts -split '\s+'
          $behind = [int]$parts[0]
          $ahead = [int]$parts[1]
          $status = if ($behind -eq 0) { 'SYNCED' } else { 'BEHIND' }
          @(
            '## Guardian PR baseline check',
            '',
            '| Status | Ahead of main | Behind main |',
            '|---|---:|---:|',
            "| $status | $ahead | $behind |",
            '',
            'Base: origin/main',
            "Head: $env:GITHUB_SHA"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if ($behind -gt 0) {
            Write-Warning "PR is $behind commit(s) behind main. The local Guardian Git agent will attempt a safe rebase; conflicts and protected-branch rejections remain manual blockers."
          } else {
            Write-Host "PR head is synchronized with main (ahead=$ahead, behind=0)."
          }
