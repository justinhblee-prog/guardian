name: Guardian Git Consistency Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - 'scripts/guardian-git-agent.ps1'
      - 'scripts/guardian-copilot-worker.ps1'
      - 'docs/GIT_CLI_AUTOMATION_KO.md'
      - '.github/workflows/guardian.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardian-git-consistency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-compare:
    name: Validate Git CLI agent and PR baseline
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head or triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Parse PowerShell and verify safe Git operations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @('scripts/guardian-git-agent.ps1', 'scripts/guardian-copilot-worker.ps1')
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Required PowerShell agent is missing: $path" }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed: $path"
            }
          }
          $source = Get-Content -Raw -LiteralPath 'scripts/guardian-git-agent.ps1'
          $worker = Get-Content -Raw -LiteralPath 'scripts/guardian-copilot-worker.ps1'
          $required = @(
            'gh auth status',
            'gh pr list',
            "@('fetch', 'origin'",
            "@('worktree', 'add'",
            '--rebase-merges',
            '--force-with-lease',
            'merge-base',
            'status',
            'Register-ScheduledTask',
            'Unregister-ScheduledTask',
            'Invoke-AgentWithLock',
            'guardian-copilot-worker.ps1'
          )
          foreach ($token in $required) {
            if (-not $source.Contains($token)) { throw "Required operation or safety guard missing: $token" }
          }
          if ($source -match 'push\s+--force(?!-with-lease)') {
            throw 'Unsafe unleased force push detected.'
          }
          if ($source -match 'git\s+reset\s+--hard') {
            throw 'Destructive hard reset detected.'
          }
          if (-not (Test-Path 'docs/GIT_CLI_AUTOMATION_KO.md')) {
            throw 'Git CLI automation operating guide is missing.'
          }
          $workerRequired = @(
            '--autopilot',
            '--no-ask-user',
            '--assisted-approval',
            '--max-ai-credits',
            '--max-autopilot-continues',
            '--deny-tool',
            '--available-tools',
            'GitHub.Copilot',
            'winget install',
            'shell(git reset)',
            'shell(git clean)',
            'origin/main',
            'gh auth status',
            'worktree'
          )
          foreach ($token in $workerRequired) {
            if (-not $worker.Contains($token)) { throw "Copilot worker is missing required safety/automation token: $token" }
          }
          if ($worker -match '(?m)--yolo|--allow-all') {
            throw 'Copilot worker must not grant blanket permissions.'
          }
          if ($worker -match '(?m)^\s*(?:&\s*)?git\s+reset\s+--hard' -or $worker -match '(?m)^\s*(?:&\s*)?gh\s+pr\s+merge') {
            throw 'Copilot worker contains a prohibited destructive/merge command.'
          }
          Write-Host 'PASS: both PowerShell agents parse; Git and Copilot safety guards are present.'

      - name: Compare exact PR head against current main with Git CLI
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch origin/main.' }
          $mergeBase = git merge-base origin/main HEAD
          if ($LASTEXITCODE -ne 0 -or -not $mergeBase) {
            throw 'PR head has no merge base with origin/main.'
          }
          $counts = (git rev-list --left-right --count origin/main...HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not calculate ahead/behind counts.' }
          $parts = $counts -split '\s+'
          $behind = [int]$parts[0]
          $ahead = [int]$parts[1]
          $status = if ($behind -eq 0) { 'SYNCED' } else { 'BEHIND' }
          @(
            '## Guardian PR baseline check',
            '',
            '| Status | Ahead of main | Behind main |',
            '|---|---:|---:|',
            "| $status | $ahead | $behind |",
            '',
            'Base: origin/main',
            "Head: $env:GITHUB_SHA"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if ($behind -gt 0) {
            Write-Warning "PR is $behind commit(s) behind main. The local Guardian Git agent will attempt a safe rebase; conflicts and protected-branch rejections remain manual blockers."
          } else {
            Write-Host "PR head is synchronized with main (ahead=$ahead, behind=0)."
          }
