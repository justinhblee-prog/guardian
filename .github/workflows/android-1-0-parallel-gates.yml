name: Guardian Android 1.0 Parallel Gates

# Manual-only by design. No push/PR/schedule triggers; this file is safe to stage
# without consuming hosted-runner minutes. Dispatch only after explicit cost approval.
on:
  workflow_dispatch:
    inputs:
      include_android_quality:
        description: Run Android unit tests and lint
        required: true
        type: boolean
        default: true
      include_license_api_unit:
        description: Run DB-independent License API tests
        required: true
        type: boolean
        default: true
      include_source_contract:
        description: Run source and script contract checks
        required: true
        type: boolean
        default: true
      include_postgres_integration:
        description: Run License API PostgreSQL integration tests on an ephemeral database
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: guardian-android-1-0-parallel-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate selected parallel gates
    runs-on: ubuntu-24.04
    steps:
      - name: Require at least one selected test track
        env:
          ANDROID: ${{ inputs.include_android_quality }}
          LICENSE: ${{ inputs.include_license_api_unit }}
          SOURCE: ${{ inputs.include_source_contract }}
          POSTGRES: ${{ inputs.include_postgres_integration }}
        run: |
          if [[ "$ANDROID" != true && "$LICENSE" != true && "$SOURCE" != true && "$POSTGRES" != true ]]; then
            echo "Select at least one verification track."
            exit 1
          fi

  android-quality:
    needs: [preflight]
    name: Android unit tests and lint
    if: inputs.include_android_quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android unit tests
        run: gradle -p android --no-daemon testDebugUnitTest
      - name: Run Android lint
        run: gradle -p android --no-daemon lintDebug

  license-api-unit:
    needs: [preflight]
    name: License API unit and HTTP tests
    if: inputs.include_license_api_unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/license-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Run DB-independent API tests
        run: node --test test/license-core.test.mjs test/server-http.test.mjs test/admin-ui.test.mjs test/rate-limit.test.mjs

  source-contract:
    needs: [preflight]
    name: Source, workflow and script contracts
    if: inputs.include_source_contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate shell and Python verification scripts
        run: |
          bash -n VERIFY_ANDROID_CORE.sh
          bash -n scripts/verify_android_emulator.sh
          bash -n scripts/verify_android_vpn_emulator.sh
          python3 -m py_compile scripts/verify_guardian_crash_log.py
          python3 -m unittest scripts/test_verify_guardian_crash_log.py
      - name: Check support API and migration contract
        run: |
          grep -q "'/v1/support/tickets'" server/license-api/src/server.mjs
          grep -q "'/v1/support/tickets/lookup'" server/license-api/src/server.mjs
          grep -q "'/v1/admin/support/tickets'" server/license-api/src/server.mjs
          test -s server/license-api/migrations/003_support_tickets.sql
          test -s android/app/src/main/java/com/guardian/adblock/LicenseApiClient.kt
          grep -F "SOURCE_ZIP='release/Guardian-AdBlock-Source-v0.7.30-dev.zip'" .github/workflows/android-apk.yml
          grep -F "SOURCE_SHA256=\"\$(awk '\$2 ~ /Guardian-AdBlock-Source-v0[.]7[.]30-dev[.]zip\$/" .github/workflows/android-apk.yml
          if grep -Fq "SOURCE_SHA256=\"\$(awk '\$2 ~ /Guardian-AdBlock-Source-v0[.]7[.]29-dev[.]zip\$/" .github/workflows/android-apk.yml; then
            echo "Source archive checksum extraction still targets the previous release."
            exit 1
          fi
      - name: Ensure this gate remains manual-only
        run: |
          ruby - <<'RUBY'
          require 'yaml'
          data = YAML.load_file('.github/workflows/android-1-0-parallel-gates.yml', aliases: true)
          triggers = data.fetch('on', data[true] || {})
          abort "Unexpected automatic trigger: #{triggers.keys}" unless triggers.keys == ['workflow_dispatch']
          abort 'Workflow must be read-only.' unless data.fetch('permissions') == { 'contents' => 'read' }
          RUBY

  postgres-integration:
    needs: [preflight]
    name: License API PostgreSQL integration tests
    if: inputs.include_postgres_integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: guardian-test-only
          POSTGRES_DB: guardian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: server/license-api
    env:
      DATABASE_URL: postgres://guardian:guardian-test-only@localhost:5432/guardian_test
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Initialize disposable PostgreSQL schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema.sql
      - name: Run License API PostgreSQL integration suite
        run: node --test test/postgres-integration.test.mjs

  result:
    name: Parallel gate result
    if: always()
    needs: [preflight, android-quality, license-api-unit, source-contract, postgres-integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize gate outcomes
        env:
          ANDROID: ${{ needs.android-quality.result }}
          LICENSE: ${{ needs.license-api-unit.result }}
          SOURCE: ${{ needs.source-contract.result }}
          POSTGRES: ${{ needs.postgres-integration.result }}
          PREFLIGHT: ${{ needs.preflight.result }}
        run: |
          {
            echo '## Guardian Android 1.0 parallel gates'
            echo "- Android quality: ${ANDROID}"
            echo "- License API unit: ${LICENSE}"
            echo "- Source contracts: ${SOURCE}"
            echo "- PostgreSQL integration: ${POSTGRES}"
            echo '- PostgreSQL integration, emulator E2E and Samsung device acceptance are separate gates and are not claimed by this workflow.'
            echo '- No APK or Production release is produced by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PREFLIGHT" != success ]]; then exit 1; fi
          for result in "$ANDROID" "$LICENSE" "$SOURCE" "$POSTGRES"; do
            if [[ "$result" != success && "$result" != skipped ]]; then exit 1; fi
          done
