name: Guardian AdBlock Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'shared/**'
      - 'README.md'
      - 'VERIFY_ANDROID_CORE.sh'
      - 'android/core-checks/**'
      - 'scripts/verify_apk_metadata.py'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'shared/**'
      - 'README.md'
      - 'VERIFY_ANDROID_CORE.sh'
      - 'android/core-checks/**'
      - '.github/workflows/android-apk.yml'

# Keep only the newest branch run; rapid source commits should not waste runners.
concurrency:
  group: guardian-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify shared DNS filter rules
        run: test -s shared/filter_rules.txt

      - name: Validate standalone Android core smoke script syntax
        run: bash -n VERIFY_ANDROID_CORE.sh

      - name: Verify VPN manifest and branded launcher assets
        run: |
          grep -q 'android.permission.BIND_VPN_SERVICE' android/app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="specialUse"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/drawable/ic_launcher_foreground.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          test -s android/app/src/main/assets/eugene_consulting_logo.png

      - name: Validate production release workflow trigger and signing gates
        run: |
          ruby - <<'RUBY'
          require 'yaml'
          workflow = YAML.load_file('.github/workflows/android-production-release.yml', aliases: true)
          triggers = workflow.fetch('on')
          abort 'Expected pull_request, main push and manual workflow_dispatch triggers.' unless %w[pull_request push workflow_dispatch].all? { |event| triggers.key?(event) }
          validation_if = workflow.dig('jobs', 'validate-release-configuration', 'if')
          release_if = workflow.dig('jobs', 'production-release', 'if')
          abort 'Production validation must be limited to PR and push events.' unless validation_if.is_a?(String) && validation_if.include?('github.event_name') && validation_if.include?('pull_request') && validation_if.include?('push')
          abort 'Production signing must remain manual-only.' unless release_if.is_a?(String) && release_if.include?('workflow_dispatch')
          abort 'Main push validation must be branch-scoped.' unless triggers.dig('push', 'branches') == ['main']
          RUBY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android unit tests
        run: gradle -p android --no-daemon clean testDebugUnitTest

      - name: Run Android lint checks
        run: gradle -p android --no-daemon lintDebug

      - name: Verify stable development signing certificate
        run: |
          test -s android/guardian-dev.keystore
          keytool -list -v -keystore android/guardian-dev.keystore -storepass android -alias androiddebugkey | grep -F 'ED:AE:EC:C9:E4:A2:7E:64:F0:7D:92:64:3F:B8:51:40:72:50:83:AB:ED:55:3F:91:2A:0D:EE:03:87:FB:D8:2C'

      - name: Assemble previous dev version for upgrade test
        run: |
          gradle -p android --no-daemon -PguardianVersionCode=24 -PguardianVersionName=0.7.11-dev assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/guardian-0.7.11-dev.apk

      - name: Assemble current debug APK for build verification
        run: gradle -p android --no-daemon -PguardianVersionCode=25 -PguardianVersionName=0.7.12-dev assembleDebug

      - name: Verify bundled DNS filter library inside APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/filter_rules.txt'
          unzip -p "$APK" assets/filter_rules.txt | cmp - shared/filter_rules.txt
          unzip -Z1 "$APK" | grep -Fx 'assets/eugene_consulting_logo.b64'
          unzip -p "$APK" assets/eugene_consulting_logo.b64 | base64 -d > /tmp/eugene-consulting-logo.png
          python3 -c "from pathlib import Path; p=Path('/tmp/eugene-consulting-logo.png').read_bytes(); assert p.startswith(bytes.fromhex('89504e470d0a1a0a')) and len(p)>1000, 'Invalid supplied company PNG logo'"
          echo "Bundled filter rules and supplied company logo are present and valid."

      - name: Install and launch APK on Android emulator
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          # Avoid the runner action's post-boot settings ADB call; it intermittently
          # fails with Broken pipe on otherwise booted API 35 emulators.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: |
            timeout 120s adb wait-for-device
            for attempt in $(seq 1 60); do if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')" = "1" ]; then break; fi; sleep 2; done
            test "$(adb shell getprop sys.boot_completed | tr -d '\\r')" = "1"
            # Wait for PackageManager; boot_completed alone can precede Binder service readiness.
            services_ready=0; for attempt in $(seq 1 60); do if adb shell cmd package list packages 2>/dev/null | grep -q 'com.android.settings'; then services_ready=1; break; fi; sleep 3; done; test "$services_ready" -eq 1
            adb logcat -c
            # Keep metadata verification in a standalone script; heredocs inside
            # this action's nested shell script are not reliably dedented.
            python3 scripts/verify_apk_metadata.py /tmp/guardian-0.7.11-dev.apk 24 0.7.11-dev android/app/build/outputs/apk/debug/app-debug.apk 25 0.7.12-dev
            # Install the previous signed build first, then upgrade in place.
            adb install /tmp/guardian-0.7.11-dev.apk
            adb shell pm path com.guardian.adblock | grep -F 'package:'
            installed=0; for attempt in 1 2 3; do if adb install -r android/app/build/outputs/apk/debug/app-debug.apk; then installed=1; break; fi; echo "ADB package-manager upgrade attempt ${attempt} failed; waiting for system services before retry."; adb wait-for-device; adb shell cmd package list packages >/dev/null 2>&1 || true; sleep 5; done; test "$installed" -eq 1
            adb shell pm path com.guardian.adblock | grep -F 'package:'
            adb shell am start -n com.guardian.adblock/.MainActivity
            sleep 8
            adb shell dumpsys activity activities | tee /tmp/guardian-activities.txt
            grep -F 'com.guardian.adblock' /tmp/guardian-activities.txt
            adb logcat -d -t 5000 | tee /tmp/guardian-logcat.txt
            ! grep -E 'FATAL EXCEPTION|Process: com\\.guardian\\.adblock.*has died' /tmp/guardian-logcat.txt

      - name: Verify APK package identity and version
        run: |
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.guardian.adblock' versionCode='25' versionName='0.7.12-dev'"

      - name: Verify APK exists and calculate checksum
        shell: bash
        run: |
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt
          ls -lh "$APK"

      - name: Package source and release verification summary
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          mkdir -p release
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          cat > release/VERIFICATION_SUMMARY_KO.md <<EOF
          # Guardian AdBlock v0.7.12-dev — 빌드 검증 결과

          - 저장소 커밋: ${GITHUB_SHA}
          - GitHub Actions 실행: ${GITHUB_RUN_ID}
          - 패키지: com.guardian.adblock
          - versionCode: 25
          - versionName: 0.7.12-dev
          - Android 단위 테스트: 통과
          - Android lintDebug: 통과
          - assembleDebug: 통과
          - Android API 35 에뮬레이터 v0.7.11-dev → v0.7.12-dev 서명 일치 업그레이드·앱 실행 smoke test: 통과
          - APK 패키지명·버전 검사: 통과
          - APK SHA-256: ${APK_SHA256}
          - 서명 유형: Android debug 서명 (배포용 production 서명 아님)
          - 물리 기기 VPN 승인·실제 DNS 라우팅·광고 제거 테스트: 미실시

          이 결과는 GitHub Actions 자동화 검증이며, 물리 기기 수용 테스트나 모든 앱의 광고 제거를 보증하지 않습니다.
          EOF
          zip -qr 'release/Guardian-AdBlock-Source-v0.7.12-dev.zip' . -x '.git/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*/local.properties' '*/.idea/*' '*.apk' 'release/*.zip'
          ls -lh release/Guardian-AdBlock-Source-v0.7.12-dev.zip release/VERIFICATION_SUMMARY_KO.md

      - name: Upload installable debug APK and complete source package (final build only)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: Guardian-AdBlock-Android-Full-Package-v0.7.12-dev
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            release/Guardian-AdBlock-Source-v0.7.12-dev.zip
            release/VERIFICATION_SUMMARY_KO.md
          if-no-files-found: error
          retention-days: 30
