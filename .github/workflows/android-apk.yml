name: Guardian AdBlock Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'shared/**'
      - 'README.md'
      - '.github/workflows/android-apk.yml'

# Keep only the newest branch run; rapid source commits should not waste runners.
concurrency:
  group: guardian-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify shared DNS filter rules
        run: test -s shared/filter_rules.txt

      - name: Verify VPN manifest and branded launcher assets
        run: |
          grep -q 'android.permission.BIND_VPN_SERVICE' android/app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="specialUse"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/drawable/ic_launcher_foreground.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android/app/src/main/res/mipmap-anydpi/ic_launcher.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android unit tests
        run: gradle -p android --no-daemon clean testDebugUnitTest

      - name: Run Android lint checks
        run: gradle -p android --no-daemon lintDebug

      - name: Assemble debug APK for build verification
        run: gradle -p android --no-daemon assembleDebug

      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.guardian.adblock 1
            adb shell pidof com.guardian.adblock

      - name: Verify APK package identity and version
        run: |
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.guardian.adblock' versionCode='21' versionName='0.7.8-dev'"

      - name: Verify APK exists and calculate checksum
        shell: bash
        run: |
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt
          ls -lh "$APK"

      - name: Package source and release verification summary
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p release
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          cat > release/VERIFICATION_SUMMARY_KO.md <<EOF
          # Guardian AdBlock v0.7.8-dev — 빌드 검증 결과

          - 저장소 커밋: ${GITHUB_SHA}
          - GitHub Actions 실행: ${GITHUB_RUN_ID}
          - 패키지: com.guardian.adblock
          - versionCode: 21
          - versionName: 0.7.8-dev
          - Android 단위 테스트: 통과
          - Android lintDebug: 통과
          - assembleDebug: 통과
          - Android API 35 에뮬레이터 APK 설치·앱 실행 smoke test: 통과
          - APK 패키지명·버전 검사: 통과
          - APK SHA-256: ${APK_SHA256}
          - 서명 유형: Android debug 서명 (배포용 production 서명 아님)
          - 물리 기기 VPN 승인·실제 DNS 라우팅·광고 제거 테스트: 미실시

          이 결과는 GitHub Actions 자동화 검증이며, 물리 기기 수용 테스트나 모든 앱의 광고 제거를 보증하지 않습니다.
          EOF
          zip -qr 'release/Guardian-AdBlock-Source-v0.7.8-dev.zip' . -x '.git/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*/local.properties' '*/.idea/*' '*.apk' 'release/*.zip'
          ls -lh release/Guardian-AdBlock-Source-v0.7.8-dev.zip release/VERIFICATION_SUMMARY_KO.md

      - name: Upload installable debug APK and complete source package (final build only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Guardian-AdBlock-Android-Full-Package-v0.7.8-dev
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            release/Guardian-AdBlock-Source-v0.7.8-dev.zip
            release/VERIFICATION_SUMMARY_KO.md
          if-no-files-found: error
          retention-days: 30
