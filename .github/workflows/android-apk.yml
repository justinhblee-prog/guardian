name: Guardian AdBlock Android APK

on:
  workflow_dispatch:
  push:
    # Verify development branches as well as main; their commit checks also
    # surface on the associated PR, even if a PR webhook is missed.
    branches: [main]
    paths:
      - 'android/**'
      - 'shared/**'
      - 'README.md'
      - 'docs/**'
      - 'VERIFY_ANDROID_CORE.sh'
      - 'android/core-checks/**'
      - 'scripts/verify_apk_metadata.py'
      - 'scripts/resolve_guardian_dev_version.py'
      - 'scripts/test_resolve_guardian_dev_version.py'
      - 'scripts/verify_guardian_versions.py'
      - 'scripts/test_verify_guardian_versions.py'
      - 'scripts/verify_android_emulator.sh'
      - 'scripts/verify_android_vpn_emulator.sh'
      - 'scripts/verify_android_responsive_emulator.sh'
      - 'scripts/verify_guardian_crash_log.py'
      - 'scripts/test_verify_guardian_crash_log.py'
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/guardian-engineering-orchestrator.yml'
  # PR verification is unconditional: the workflow definition on the base
  # branch controls PR events, so changing filters only inside a PR cannot fix
  # a missing check on that same PR.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Each PR has its own concurrency group, so a new commit only supersedes
# an older run for that same PR; unrelated PRs never cancel one another.
# New commits supersede stale runs for both PRs and main.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'guardian-android-dev-release' || format('guardian-android-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-apk:
    # Pull requests provide the authoritative validation for feature branches.
    # Avoid running the same expensive emulator suite twice on every PR commit.
    # Keep main pushes and explicit workflow_dispatch builds fully enabled.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    name: Test and assemble debug APK
    # Pin the stable Ubuntu 24.04 image: ubuntu-latest moved to 26.04,
    # whose Android Emulator runtime is missing libpulse.so.0.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the next published development version
        id: dev_version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          # Every build, including PR validation, must be newer than the latest
          # published APK so the emulator can perform a real in-place upgrade.
          # Main reruns reuse the release version for the same source commit.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > release/guardian-releases.json
          python3 scripts/resolve_guardian_dev_version.py \
            --releases-json release/guardian-releases.json \
            --commit "$GITHUB_SHA" \
            --github-env "$GITHUB_ENV" \
            --github-output "$GITHUB_OUTPUT"
          echo "Version resolution completed."

      - name: Verify shared DNS filter rules
        run: test -s shared/filter_rules.txt

      - name: Validate standalone Android core smoke script syntax
        run: |
          bash -n VERIFY_ANDROID_CORE.sh
          bash -n scripts/verify_android_emulator.sh
          bash -n scripts/verify_android_vpn_emulator.sh
          bash -n scripts/verify_android_responsive_emulator.sh
          python3 -m py_compile scripts/verify_guardian_crash_log.py scripts/resolve_android_dialog_row.py scripts/android_navigation_compat.py scripts/verify_guardian_versions.py
          python3 -m unittest scripts/test_verify_guardian_crash_log.py scripts/test_resolve_android_dialog_row.py scripts/test_resolve_guardian_dev_version.py scripts/test_android_navigation_compat.py scripts/test_verify_guardian_versions.py

      - name: Verify VPN manifest and branded launcher assets
        run: |
          grep -q 'android.permission.BIND_VPN_SERVICE' android/app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="specialUse"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.QUERY_ALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          grep -q 'tools:ignore="QueryAllPackagesPermission"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.PACKAGE_USAGE_STATS' android/app/src/main/AndroidManifest.xml
          grep -q 'UsageStatsManager' android/app/src/main/java/com/guardian/adblock/ForegroundAppMonitor.kt
          grep -q 'AppForegroundPauseSettings.KEY_PAUSED' android/app/src/main/java/com/guardian/adblock/GuardianVpnService.kt
          test -s docs/APP_FOREGROUND_AUTO_PAUSE_KO.md
          grep -q '기기 전체' docs/APP_FOREGROUND_AUTO_PAUSE_KO.md
          grep -q 'getInstalledApplications(' android/app/src/main/java/com/guardian/adblock/InstalledAppInventory.kt
          grep -q 'getInstalledPackages(' android/app/src/main/java/com/guardian/adblock/InstalledAppInventory.kt
          grep -q 'MATCH_DISABLED_COMPONENTS' android/app/src/main/java/com/guardian/adblock/InstalledAppInventory.kt
          grep -q 'InstalledAppInventory.load' android/app/src/main/java/com/guardian/adblock/MainActivity.kt
          grep -q '설치 앱 목록 접근 안내' android/app/src/main/java/com/guardian/adblock/MainActivity.kt
          grep -q '동의하고 계속' android/app/src/main/java/com/guardian/adblock/MainActivity.kt
          grep -q 'com.samsung.android.spayfw' docs/ANDROID_APP_VISIBILITY_KO.md
          grep -q '앱별 제외는 앱의 네트워크 경로를 우회시키는 기능' docs/ANDROID_APP_VISIBILITY_KO.md
          grep -q '기기 전체의 VPN 상태를 확인하는 앱은 경고를 표시할 수 있습니다' android/app/src/main/java/com/guardian/adblock/MainActivity.kt
          grep -q '앱별 보호 제외 및 선택 앱 자동 VPN 일시중지 기능' android/app/src/main/java/com/guardian/adblock/MainActivity.kt
          test -s docs/ANDROID_APP_VISIBILITY_KO.md
          test -s android/app/src/main/res/drawable/ic_launcher_foreground.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          test -s android/app/src/main/assets/eugene_consulting_logo.png

      - name: Validate production release workflow trigger and signing gates
        run: |
          ruby - <<'RUBY'
          require 'yaml'
          workflow = YAML.load_file('.github/workflows/android-production-release.yml', aliases: true)
          triggers = workflow.fetch('on')
          abort 'Expected pull_request, main push and manual workflow_dispatch triggers.' unless %w[pull_request push workflow_dispatch].all? { |event| triggers.key?(event) }
          validation_if = workflow.dig('jobs', 'validate-release-configuration', 'if')
          release_if = workflow.dig('jobs', 'production-release', 'if')
          abort 'Production validation must be limited to PR and push events.' unless validation_if.is_a?(String) && validation_if.include?('github.event_name') && validation_if.include?('pull_request') && validation_if.include?('push')
          abort 'Production signing must remain manual-only.' unless release_if.is_a?(String) && release_if.include?('workflow_dispatch')
          abort 'Main push validation must be branch-scoped.' unless triggers.dig('push', 'branches') == ['main']
          release_setup = File.read('server/license-api/windows/Prepare-GuardianProductionRelease.ps1')
          approval_guard = release_setup.index('$unapprovedSources =')
          first_keystore_or_secret_write = [
            release_setup.index('keytool -genkeypair'),
            release_setup.index("Set-GitHubSecret 'GUARDIAN_RELEASE_KEYSTORE_BASE64'")
          ].compact.min
          abort 'Production release setup must fail closed on missing redistribution approval before keystore/secrets writes.' unless
            approval_guard && first_keystore_or_secret_write && approval_guard < first_keystore_or_secret_write &&
            release_setup.include?('redistributionApproved') && release_setup.include?('redistributionApprovalRef')
          keystore_validation = release_setup.index('keytool -list -keystore')
          first_secret_write = release_setup.index("Set-GitHubSecret 'GUARDIAN_RELEASE_KEYSTORE_BASE64'")
          abort 'Production release setup must validate local keystore before changing GitHub secrets.' unless
            keystore_validation && first_secret_write && keystore_validation < first_secret_write
          RUBY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android unit tests
        run: gradle -p android --no-daemon clean testDebugUnitTest

      - name: Run Android lint checks
        run: gradle -p android --no-daemon lintDebug

      - name: Verify stable development signing certificate
        run: |
          test -s android/guardian-dev.keystore
          keytool -list -v -keystore android/guardian-dev.keystore -storepass android -alias androiddebugkey | grep -F 'ED:AE:EC:C9:E4:A2:7E:64:F0:7D:92:64:3F:B8:51:40:72:50:83:AB:ED:55:3F:91:2A:0D:EE:03:87:FB:D8:2C'
      - name: Download and verify the actual previous published APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Select the newest immutable published development release whose
          # versionCode is lower than this build. Never rebuild the baseline
          # from current source: that would hide signing-key regressions.
          PREVIOUS_TAG="$(python3 - "release/guardian-releases.json" "$GUARDIAN_VERSION_CODE" <<'PY'
          import json, re, sys
          releases = json.load(open(sys.argv[1], encoding="utf-8"))
          current = int(sys.argv[2])
          candidates = []
          for release in releases:
              if release.get("draft") or not release.get("prerelease"):
                  continue
              match = re.fullmatch(r"guardian-dev-v([0-9]+)", release.get("tag_name", ""))
              if not match:
                  continue
              code = int(match.group(1))
              assets = {asset.get("name") for asset in release.get("assets", [])}
              if code < current and {"guardian-android-dev.apk", "guardian-android-dev.json"} <= assets:
                  candidates.append((code, release["tag_name"]))
          if not candidates:
              raise SystemExit(f"No published Guardian predecessor APK exists below versionCode {current}.")
          print(max(candidates)[1])
          PY
          )"
          mkdir -p /tmp/guardian-previous-release
          gh release download "$PREVIOUS_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern guardian-android-dev.apk \
            --pattern guardian-android-dev.json \
            --dir /tmp/guardian-previous-release
          PREVIOUS_APK="/tmp/guardian-previous-release/guardian-android-dev.apk"
          PREVIOUS_MANIFEST="/tmp/guardian-previous-release/guardian-android-dev.json"
          test -s "$PREVIOUS_APK"
          test -s "$PREVIOUS_MANIFEST"

          python3 - "$PREVIOUS_MANIFEST" "$PREVIOUS_APK" "$GUARDIAN_VERSION_CODE" <<'PY'
          import hashlib, json, pathlib, sys
          manifest_path, apk_path, current_code = sys.argv[1:]
          manifest = json.loads(pathlib.Path(manifest_path).read_text(encoding="utf-8"))
          assert manifest.get("packageName") == "com.guardian.adblock", "Previous release package name mismatch."
          assert int(manifest.get("versionCode", 0)) < int(current_code), "Previous APK is not older than the current build."
          assert manifest.get("versionName"), "Previous release versionName is missing."
          assert manifest.get("signerSha256") == "edaeecc9e4a27e64f07d92643fb85140725083abed553f912a0dee0387fbd82c", "Published predecessor has an unexpected signer."
          digest = hashlib.sha256(pathlib.Path(apk_path).read_bytes()).hexdigest()
          assert manifest.get("sha256") == digest, "Published predecessor APK SHA-256 does not match its release manifest."
          print(f"Verified actual published predecessor: {manifest['versionName']} ({manifest['versionCode']}), SHA-256 {digest}")
          with open(__import__("os").environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"GUARDIAN_PREVIOUS_APK={apk_path}\n")
              env.write(f"GUARDIAN_PREVIOUS_VERSION_CODE={manifest['versionCode']}\n")
              env.write(f"GUARDIAN_PREVIOUS_VERSION_NAME={manifest['versionName']}\n")
          PY

          # Independently inspect the APK itself. Do not trust its sidecar JSON
          # as proof of package identity or signer identity.
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$PREVIOUS_APK")"
          echo "$BADGING" | grep -F "package: name='com.guardian.adblock'"
          ACTUAL_SIGNER="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$PREVIOUS_APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_SIGNER" = "edaeecc9e4a27e64f07d92643fb85140725083abed553f912a0dee0387fbd82c"
          echo "Previous release APK package and signing certificate independently verified."

      - name: Assemble current debug APK for build verification
        shell: bash
        env:
          # Public verification keys and HTTPS service origins are safe to embed in the APK.
          # Never pass the license signing private key or Android release keystore here.
          GUARDIAN_LICENSE_API_BASE_URL: ${{ vars.GUARDIAN_LICENSE_API_BASE_URL }}
          GUARDIAN_LICENSE_PUBLIC_KEY: ${{ vars.GUARDIAN_LICENSE_PUBLIC_KEY }}
          # The emulator acceptance run verifies the built-in public filter path.
          # Signed-manifest delivery is validated separately by release configuration and
          # signed-manifest tests; do not make this runtime test depend on a live endpoint.
          GUARDIAN_MANIFEST_BASE_URL: ""
          GUARDIAN_MANIFEST_PUBLIC_KEY: ""
        run: |
          set -euo pipefail
          echo "License API URL configured: $([[ -n "$GUARDIAN_LICENSE_API_BASE_URL" ]] && echo yes || echo no)"
          echo "License public key configured: $([[ -n "$GUARDIAN_LICENSE_PUBLIC_KEY" ]] && echo yes || echo no)"
          echo "Signed filter URL configured: $([[ -n "$GUARDIAN_MANIFEST_BASE_URL" ]] && echo yes || echo no)"
          echo "Signed filter public key configured: $([[ -n "$GUARDIAN_MANIFEST_PUBLIC_KEY" ]] && echo yes || echo no)"
          gradle -p android --no-daemon assembleDebug

      - name: Verify bundled DNS filter library inside APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/filter_rules.txt'
          unzip -p "$APK" assets/filter_rules.txt | cmp - shared/filter_rules.txt
          unzip -Z1 "$APK" | grep -Fx 'assets/eugene_consulting_logo.b64'
          unzip -p "$APK" assets/eugene_consulting_logo.b64 | base64 -d > /tmp/eugene-consulting-logo.png
          python3 -c "from pathlib import Path; p=Path('/tmp/eugene-consulting-logo.png').read_bytes(); assert p.startswith(bytes.fromhex('89504e470d0a1a0a')) and len(p)>1000, 'Invalid supplied company PNG logo'"
          echo "Bundled filter rules and supplied company logo are present and valid."

      - name: Verify APK package identity and version
        run: |
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.guardian.adblock' versionCode='${GUARDIAN_VERSION_CODE}' versionName='${GUARDIAN_VERSION_NAME}'"

      - name: Verify APK exists and calculate checksum
        shell: bash
        run: |
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt
          ls -lh "$APK"

      - name: Package source and release verification summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          SOURCE_ZIP="release/Guardian-AdBlock-Source-${GUARDIAN_VERSION_NAME}.zip"

          # Archive the exact commit that produced the APK, including app source,
          # tests, shared rules, server tools, scripts, workflows and docs.
          git archive --format=zip --prefix="Guardian-AdBlock-Source-${GUARDIAN_VERSION_NAME}/" "$GITHUB_SHA" -- . \
            ':(exclude,top)android/guardian-dev.keystore' \
            ':(exclude,glob)**/*.jks' ':(exclude,glob)**/*.keystore' \
            ':(exclude,glob)**/*.p12' ':(exclude,glob)**/*.pfx' \
            ':(exclude,glob)**/*.dpapi' ':(exclude,glob)**/*.pem' \
            ':(exclude,glob)**/.env' ':(exclude,glob)**/sources.json' \
            ':(exclude,glob)**/*.bak' ':(exclude,glob)**/secrets/**' \
            ':(exclude,glob)**/dist/**' ':(exclude,glob)**/logs/**' > "$SOURCE_ZIP"
          test -s "$SOURCE_ZIP"
          unzip -t "$SOURCE_ZIP" >/dev/null
          unzip -Z1 "$SOURCE_ZIP" | grep -Fx "Guardian-AdBlock-Source-${GUARDIAN_VERSION_NAME}/android/app/src/main/AndroidManifest.xml"
          unzip -Z1 "$SOURCE_ZIP" | grep -Fx "Guardian-AdBlock-Source-${GUARDIAN_VERSION_NAME}/server/license-api/admin/index.html"
          unzip -Z1 "$SOURCE_ZIP" | grep -Fx "Guardian-AdBlock-Source-${GUARDIAN_VERSION_NAME}/shared/filter_rules.txt"
          if unzip -Z1 "$SOURCE_ZIP" | grep -Eiq '(^|/)([^/]*\.(jks|keystore|p12|pfx|dpapi|pem)|\.env|sources\.json|[^/]*\.bak)$|(^|/)secrets/|(^|/)(dist|logs)/'; then
            echo "Source archive contains a signing key, secret/config file, backup, or generated runtime output."
            exit 1
          fi

          # Keep both deliverables covered by one manifest; the APK-local
          # SHA256SUMS.txt remains available for simple APK-only checks.
          sha256sum "$APK" "$SOURCE_ZIP" > release/SHA256SUMS.txt
          APK_SHA256="$(awk '$2 ~ /app-debug[.]apk$/ {print $1; exit}' release/SHA256SUMS.txt)"
          SOURCE_SHA256="$(awk -v source="$SOURCE_ZIP" '$2 == source {print $1; exit}' release/SHA256SUMS.txt)"
          SOURCE_BYTES="$(wc -c < "$SOURCE_ZIP" | tr -d ' ')"
          test "${#APK_SHA256}" -eq 64
          test "${#SOURCE_SHA256}" -eq 64

          cat > release/VERIFICATION_SUMMARY_KO.md <<EOF
          # Guardian AdBlock ${GUARDIAN_VERSION_NAME} — 빌드 및 소스 패키지 검증 결과

          - 저장소 커밋: ${GITHUB_SHA}
          - GitHub Actions 실행: ${GITHUB_RUN_ID}
          - 패키지: com.guardian.adblock
          - versionCode: ${GUARDIAN_VERSION_CODE}
          - versionName: ${GUARDIAN_VERSION_NAME}
          - Android 단위 테스트: 통과
          - Android lintDebug: 통과
          - assembleDebug: 통과
          - APK SHA-256: ${APK_SHA256}
          - 전체 소스 ZIP: Guardian-AdBlock-Source-${GUARDIAN_VERSION_NAME}.zip
          - 전체 소스 ZIP 크기: ${SOURCE_BYTES} bytes
          - 전체 소스 ZIP SHA-256: ${SOURCE_SHA256}
          - 소스 ZIP 무결성 및 Android manifest/License Admin/shared filter 파일 검사: 통과
          - 소스 ZIP 내 서명키/개인키/DPAPI/환경 파일/운영 산출물 제외 검사: 통과
          - Android API 35 에뮬레이터 업그레이드 및 VPN E2E: 이 workflow 후속 단계에서 실행하고 최종 보고서에 별도 기록
          - 에뮬레이터 테스트 실패 시에도 빌드 산출물은 별도 제공하며, 해당 APK를 런타임 검증 완료로 간주하지 않습니다.
          - 이 결과는 Android 실기기 VPN/광고 차단 수용 테스트를 의미하지 않습니다.
          EOF

      - name: Create development update manifest
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIGNER_SHA256='edaeecc9e4a27e64f07d92643fb85140725083abed553f912a0dee0387fbd82c'
          cat > release/guardian-android-dev.json <<EOF
          {
            "packageName": "com.guardian.adblock",
            "versionName": "${GUARDIAN_VERSION_NAME}",
            "versionCode": ${GUARDIAN_VERSION_CODE},
            "sha256": "$SHA256",
            "signerSha256": "$SIGNER_SHA256",
            "channel": "development"
          }
          EOF
          python3 -m json.tool release/guardian-android-dev.json >/dev/null

      - name: Verify development update manifest matches APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          apk = pathlib.Path("android/app/build/outputs/apk/debug/app-debug.apk")
          manifest = json.loads(pathlib.Path("release/guardian-android-dev.json").read_text())
          assert manifest["packageName"] == "com.guardian.adblock"
          assert manifest["versionCode"] == int("${{ env.GUARDIAN_VERSION_CODE }}")
          assert manifest["versionName"] == "${{ env.GUARDIAN_VERSION_NAME }}"
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+-dev", manifest["versionName"])
          assert manifest["sha256"] == hashlib.sha256(apk.read_bytes()).hexdigest()
          assert manifest["signerSha256"] == "edaeecc9e4a27e64f07d92643fb85140725083abed553f912a0dee0387fbd82c"
          print("Development update manifest exactly matches the built APK.")
          PY

      - name: Upload verified Android debug and source package
        uses: actions/upload-artifact@v4
        with:
          name: guardian-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            release/Guardian-AdBlock-Source-${{ env.GUARDIAN_VERSION_NAME }}.zip
            release/SHA256SUMS.txt
            release/VERIFICATION_SUMMARY_KO.md
            release/guardian-android-dev.json
          if-no-files-found: error
          retention-days: 14

      # The emulator is launched with -no-audio below. Do not install host
      # audio libraries here: apt mirrors are unreliable on hosted runners and
      # audio is not part of Guardian's VPN/network verification.
      - name: Install Android emulator audio runtime dependency
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # qemu-system-x86_64 links libpulse.so.0 even when the emulator is
          # launched with -no-audio. Install the small runtime package before
          # starting the headless VPN emulator; retry transient Ubuntu mirror
          # failures rather than treating them as a Guardian source failure.
          if ! ldconfig -p | grep -q 'libpulse.so.0'; then
            export DEBIAN_FRONTEND=noninteractive
            installed=0
            for attempt in 1 2 3; do
              echo "libpulse0 install attempt ${attempt}/3"
              if sudo apt-get --no-install-recommends \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                install -y libpulse0; then
                installed=1
                break
              fi
              sleep 8
            done
            if [ "$installed" -ne 1 ]; then
              echo "Could not install required qemu runtime library libpulse0."
              exit 1
            fi
          fi
          ldconfig -p | grep 'libpulse.so.0'

      - name: Enable KVM access for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            echo "KVM access enabled for the ephemeral GitHub-hosted runner."
          else
            echo "KVM device is unavailable on this runner; x86_64 emulator cannot run without hardware acceleration."
            exit 1
          fi

      - name: Preinstall Android emulator package with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Android Emulator SDK install attempt $attempt/3 (5-minute cap)"
            if timeout --signal=TERM --kill-after=10s 300s sdkmanager --install 'emulator' 'system-images;android-35;google_apis;x86_64' --channel=0; then
              EMULATOR_BIN="$ANDROID_HOME/emulator/emulator"
              if [ -x "$EMULATOR_BIN" ]; then
                timeout --signal=TERM --kill-after=5s 15s "$EMULATOR_BIN" -version
                exit 0
              fi
              echo "SDK install returned success but emulator binary is missing: $EMULATOR_BIN"
            else
              status=$?
              echo "SDK install attempt $attempt failed or timed out (exit=$status)."
            fi
            sleep 10
          done
          echo "Android Emulator SDK package could not be installed after 3 bounded attempts."
          exit 1

      - name: Install and launch APK on Android emulator
        id: android_emulator
        env:
          GUARDIAN_PREVIOUS_APK: ${{ env.GUARDIAN_PREVIOUS_APK }}
          GUARDIAN_PREVIOUS_VERSION_CODE: ${{ env.GUARDIAN_PREVIOUS_VERSION_CODE }}
          GUARDIAN_PREVIOUS_VERSION_NAME: ${{ env.GUARDIAN_PREVIOUS_VERSION_NAME }}
          GUARDIAN_CURRENT_VERSION_CODE: ${{ env.GUARDIAN_VERSION_CODE }}
          GUARDIAN_CURRENT_VERSION_NAME: ${{ env.GUARDIAN_VERSION_NAME }}
        # Keep the APK artifact even if emulator infrastructure or VPN E2E fails.
        continue-on-error: true
        # Bound a wedged ADB/emulator boot so the job reaches its diagnostic
        # and final-report steps instead of sitting on a silent runner.
        timeout-minutes: 20
        shell: bash
        run: |
          set -Eeuo pipefail
          AVD_NAME=guardian-ci
          EMULATOR_BIN="$ANDROID_HOME/emulator/emulator"
          AVD_LOG="$RUNNER_TEMP/guardian-emulator.log"
          export ANDROID_SERIAL=emulator-5554
          # Keep AVD creation and emulator lookup on one explicit directory.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export ANDROID_SDK_HOME="$HOME"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "Runner kernel: $(uname -a)"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          if [ -e /dev/kvm ]; then
            echo "/dev/kvm is present"
            ls -l /dev/kvm
          else
            echo "/dev/kvm is absent; emulator will select software acceleration"
          fi
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          "$AVDMANAGER" create avd --force --name "$AVD_NAME" --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_2' <<< 'no'
          echo "=== AVD manager inventory ==="
          "$AVDMANAGER" list avd
          echo "=== AVD files ==="
          find "$ANDROID_AVD_HOME" -maxdepth 3 -type f -printf '%p (%s bytes)\n' || true
          test -s "$ANDROID_AVD_HOME/$AVD_NAME.ini"
          test -s "$ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini"
          "$EMULATOR_BIN" -list-avds | grep -Fx "$AVD_NAME"
          # Use the runner's actual upstream resolver. Public DNS is not
          # guaranteed to be reachable from hosted-runner networks; the
          # emulator's 10.0.2.3 proxy otherwise returns ECONNREFUSED.
          HOST_DNS_SERVERS="$(
            {
              awk '$1 == "nameserver" { print $2 }' /etc/resolv.conf
              if command -v resolvectl >/dev/null 2>&1; then
                resolvectl dns 2>/dev/null | grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}' || true
              fi
            } | awk '$0 !~ /^127\./ && $0 != "::1" && $0 !~ /^169\.254\./ && !seen[$0]++' | paste -sd, -
          )"
          if [ -z "$HOST_DNS_SERVERS" ]; then
            echo "Runner did not expose an upstream DNS resolver; using public fallback."
            HOST_DNS_SERVERS="8.8.8.8,1.1.1.1"
          fi
          echo "Android emulator upstream DNS servers: $HOST_DNS_SERVERS"
          getent ahostsv4 adguardteam.github.io | head -n 3
          adb start-server
          nohup "$EMULATOR_BIN" -avd "$AVD_NAME" -port 5554 -accel auto -no-window -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -no-audio -no-boot-anim -camera-back none -camera-front none -dns-server "$HOST_DNS_SERVERS" -netfast > "$AVD_LOG" 2>&1 &
          EMULATOR_PID=$!
          echo "Started emulator PID=$EMULATOR_PID, log=$AVD_LOG"
          ready=0
          # 480 x 2 seconds = 16 minutes maximum boot wait; the step
          # has a 20-minute hard limit to leave time for diagnostics/reporting.
          for attempt in $(seq 1 480); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited before ADB registration."
              break
            fi
            state="$(timeout 8s adb devices | awk '$1=="emulator-5554" {print $2}')"
            if [ "$state" = "device" ]; then
              boot="$(timeout 10s adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$boot" = "1" ]; then
                ready=1
                break
              fi
            fi
            if (( attempt % 15 == 0 )); then
              echo "Waiting for emulator boot ($attempt/480); ADB state=${state:-missing}"
              adb devices -l || true
              tail -n 30 "$AVD_LOG" || true
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Emulator failed to reach sys.boot_completed=1."
            echo "=== ADB devices ==="
            adb devices -l || true
            echo "=== Emulator process ==="
            ps -ef | grep -E '[e]mulator|[q]emu' || true
            echo "=== Emulator log (last 500 lines) ==="
            tail -n 500 "$AVD_LOG" || true
            exit 1
          fi
          echo "Android emulator boot completed on emulator-5554."
          bash scripts/verify_android_emulator.sh
          bash scripts/verify_android_vpn_emulator.sh
          bash scripts/verify_android_responsive_emulator.sh

      - name: Capture emulator diagnostics on failure
        if: steps.android_emulator.outcome == 'failure'
        shell: bash
        run: |
          set +e
          mkdir -p emulator-diagnostics
          # A wedged emulator/ADB daemon must not stall the failure handler and
          # prevent the APK/checksum/artifact steps from running.
          capture() {
            local name="$1"
            shift
            timeout --signal=TERM --kill-after=3s 15s "$@" \
              > "emulator-diagnostics/${name}.txt" 2>&1
            local status=$?
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "TIMEOUT after 15 seconds: $*" >> "emulator-diagnostics/${name}.txt"
            elif [ "$status" -ne 0 ]; then
              echo "EXIT STATUS: $status ($*)" >> "emulator-diagnostics/${name}.txt"
            fi
          }
          capture devices adb devices -l
          capture adb-server adb server-status
          capture getprop adb shell getprop
          capture logcat adb logcat -d -t 12000
          capture activities adb shell dumpsys activity activities
          capture ui-dump adb shell uiautomator dump /sdcard/guardian-window.xml
          if timeout --signal=TERM --kill-after=3s 15s adb exec-out cat /sdcard/guardian-window.xml > emulator-diagnostics/ui-hierarchy.xml 2>&1; then :; fi
          if timeout --signal=TERM --kill-after=3s 15s adb exec-out screencap -p > emulator-diagnostics/screen.png 2>/dev/null; then :; fi
          capture package adb shell dumpsys package com.guardian.adblock
          capture vpn adb shell dumpsys vpn
          capture emulator-version "$ANDROID_HOME/emulator/emulator" -version
          capture emulator-processes ps -ef
          if [ -e /dev/kvm ]; then ls -l /dev/kvm > emulator-diagnostics/kvm.txt 2>&1; else echo '/dev/kvm absent' > emulator-diagnostics/kvm.txt; fi
          if [ -s "$RUNNER_TEMP/guardian-emulator.log" ]; then cp "$RUNNER_TEMP/guardian-emulator.log" emulator-diagnostics/emulator.log; fi
          date -u +%FT%TZ > emulator-diagnostics/captured-at.txt
          printf 'Diagnostics collection finished (individual commands are bounded to 15s).\n'

      - name: Upload emulator diagnostics
        if: steps.android_emulator.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: guardian-android-emulator-diagnostics
          path: emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Write final runtime verification result
        if: always()
        shell: bash
        run: |
          mkdir -p release
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          if [ -s "$APK" ]; then
            APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
            APK_STATUS="생성됨"
          else
            APK_SHA256="미생성"
            APK_STATUS="빌드 단계 이전 실패 또는 APK 미생성"
          fi
          cat > release/FINAL_VERIFICATION_KO.md <<EOF
          # Guardian AdBlock ${GUARDIAN_VERSION_NAME} — 최종 검증 상태

          - 커밋: ${GITHUB_SHA}
          - 실행: ${GITHUB_RUN_ID}
          - 패키지: com.guardian.adblock
          - 버전: ${GUARDIAN_VERSION_NAME} (${GUARDIAN_VERSION_CODE})
          - APK 생성 상태: ${APK_STATUS}
          - APK SHA-256: ${APK_SHA256}
          - 테스트 및 빌드 단계의 실제 결과는 위 GitHub Actions 단계 결과를 기준으로 확인합니다.
          - 에뮬레이터 업그레이드 및 VPN DNS E2E: ${{ steps.android_emulator.outcome }}
          - VPN E2E가 실패한 경우 APK는 빌드 검증 산출물일 뿐, 차단 기능 검증 완료로 간주하지 않습니다.
          - 실기기 검증은 별도입니다.
          EOF

      - name: Upload final verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-android-final-verification
          path: release/FINAL_VERIFICATION_KO.md
          if-no-files-found: error
          retention-days: 14

      - name: Fail workflow when Android VPN runtime verification fails
        if: steps.android_emulator.outcome == 'failure'
        run: |
          echo "Android emulator VPN/DNS runtime verification failed. APK build artifacts and the failure report were preserved."
          exit 1

      - name: Publish development APK update release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GUARDIAN_RELEASE_TAG"
          test -n "$TAG"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          MANIFEST="release/guardian-android-dev.json"
          cp "$APK" "release/guardian-android-dev.apk"
          test -s "$APK" && test -s "$MANIFEST"
          python3 - "$MANIFEST" "$APK" "$GUARDIAN_VERSION_CODE" "$GUARDIAN_VERSION_NAME" <<'PY'
          import hashlib, json, pathlib, sys
          manifest_path, apk_path, expected_code, expected_name = sys.argv[1:]
          manifest = json.loads(pathlib.Path(manifest_path).read_text())
          digest = hashlib.sha256(pathlib.Path(apk_path).read_bytes()).hexdigest()
          assert manifest["packageName"] == "com.guardian.adblock"
          assert manifest["versionCode"] == int(expected_code)
          assert manifest["versionName"] == expected_name
          assert manifest["sha256"] == digest
          assert manifest["signerSha256"] == "edaeecc9e4a27e64f07d92643fb85140725083abed553f912a0dee0387fbd82c"
          print(f"Validated release tag {expected_code}, {expected_name}, SHA-256 {digest}")
          PY
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "release/guardian-android-dev.apk" "$MANIFEST" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              "release/guardian-android-dev.apk" \
              "$MANIFEST" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Guardian AdBlock ${GUARDIAN_VERSION_NAME} (개발 업데이트)" \
              --notes "Guardian-Source-Commit: $GITHUB_SHA"
          fi