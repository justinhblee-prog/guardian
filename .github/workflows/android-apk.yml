name: Guardian AdBlock Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify shared DNS filter rules
        run: test -s shared/filter_rules.txt

      - name: Verify VPN manifest and branded launcher assets
        run: |
          grep -q 'android.permission.BIND_VPN_SERVICE' android/app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="specialUse"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/drawable/ic_launcher_foreground.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android/app/src/main/res/mipmap-anydpi/ic_launcher.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android unit tests and assemble APK
        run: gradle -p android --no-daemon clean testDebugUnitTest assembleDebug

      - name: Verify APK package identity and release version
        run: |
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.guardian.adblock' versionCode='11' versionName='0.6.4-dev'"

      - name: Verify APK exists and calculate checksum
        shell: bash
        run: |
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt
          ls -lh "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Guardian-AdBlock-Android-APK-v0.6.4-dev
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
