services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: guardian
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in external .env}
    volumes:
      - guardian-license-db:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - guardian-private
    security_opt:
      - no-new-privileges:true
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_URL: postgres://guardian:${POSTGRES_PASSWORD}@db:5432/guardian
      GUARDIAN_ADMIN_TOKEN: ${GUARDIAN_ADMIN_TOKEN:?Set GUARDIAN_ADMIN_TOKEN in external .env}
      GUARDIAN_LICENSE_LOOKUP_SECRET: ${GUARDIAN_LICENSE_LOOKUP_SECRET:?Set GUARDIAN_LICENSE_LOOKUP_SECRET in external .env}
      GUARDIAN_LICENSE_PRIVATE_KEY: ${GUARDIAN_LICENSE_PRIVATE_KEY:?Set GUARDIAN_LICENSE_PRIVATE_KEY in external .env}
      GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-com.guardian.adblock}
      GOOGLE_PLAY_PRODUCT_IDS: ${GOOGLE_PLAY_PRODUCT_IDS:-}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_PLAY_RTDN_AUDIENCE: ${GOOGLE_PLAY_RTDN_AUDIENCE:-}
      GOOGLE_PLAY_RTDN_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_PLAY_RTDN_SERVICE_ACCOUNT_EMAIL:-}
      GUARDIAN_RATE_LIMIT_WINDOW_MS: ${GUARDIAN_RATE_LIMIT_WINDOW_MS:-60000}
      GUARDIAN_RATE_LIMIT_MAX: ${GUARDIAN_RATE_LIMIT_MAX:-30}
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - guardian-private
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
volumes:
  guardian-license-db:
networks:
  guardian-private:
    driver: bridge
