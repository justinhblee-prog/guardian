services:
  filter-distribution:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ${GUARDIAN_FILTER_ENV_FILE:?Set GUARDIAN_FILTER_ENV_FILE to external .env}
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ${GUARDIAN_FILTER_DIST_DIR:?Set GUARDIAN_FILTER_DIST_DIR to external dist}:/app/dist:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
